<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>O4U — Photo Assigner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:#f2f4f7;color:#1b2430}
header{background:#1b2430;color:#fff;padding:12px 18px;display:flex;gap:16px;align-items:center;
 position:sticky;top:0;z-index:50;flex-wrap:wrap}
header h1{font-size:15px;font-weight:700;letter-spacing:.02em}
.bar{flex:1;min-width:180px;height:8px;background:#3a4655;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:#f5a623;width:0;transition:width .3s}
.stat{font-size:12px;color:#c8d2de;white-space:nowrap}
button{font:inherit;border:0;border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:12.5px}
.pri{background:#f5a623;color:#1b2430}.gho{background:#3a4655;color:#fff}
main{display:grid;grid-template-columns:340px 1fr;gap:14px;padding:14px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}
.panel{background:#fff;border-radius:11px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
.phead{padding:11px 14px;border-bottom:1px solid #e6eaf0;font-weight:700;font-size:12.5px;
 letter-spacing:.06em;text-transform:uppercase;color:#5a6675;display:flex;justify-content:space-between;align-items:center}
#left{position:sticky;top:64px;max-height:calc(100vh - 80px);display:flex;flex-direction:column}
.tools{padding:10px 12px;border-bottom:1px solid #e6eaf0;display:flex;flex-direction:column;gap:8px}
input[type=search]{width:100%;padding:8px 10px;border:1.5px solid #d8dee7;border-radius:7px;font:inherit}
input[type=search]:focus{outline:0;border-color:#f5a623}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:4px 10px;border-radius:99px;background:#eef1f5;font-size:11.5px;font-weight:600;cursor:pointer;color:#5a6675}
.chip.on{background:#1b2430;color:#fff}
#plist{overflow-y:auto;flex:1;padding:7px}
.pc{padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;gap:9px;align-items:center;
 border:1.5px solid transparent;margin-bottom:3px}
.pc:hover{background:#f6f8fa}
.pc.sel{background:#fff6e6;border-color:#f5a623}
.pc.done{opacity:.62}
.pc img{width:38px;height:38px;object-fit:cover;border-radius:5px;flex-shrink:0;background:#e6eaf0}
.ph{width:38px;height:38px;border-radius:5px;background:#e6eaf0;flex-shrink:0;display:flex;
 align-items:center;justify-content:center;font-size:9px;color:#9aa5b3;font-weight:700}
.pn{font-weight:600;font-size:12.5px;line-height:1.25}
.pm{font-size:10.5px;color:#7b8794;font-family:ui-monospace,Consolas,monospace}
.tick{margin-left:auto;color:#1f9d55;font-weight:700;font-size:14px}
#right{padding-bottom:20px}
.grp{margin-bottom:16px}
.gh{padding:7px 13px;background:#eef1f5;font-size:11.5px;font-weight:700;color:#5a6675;
 display:flex;gap:10px;position:sticky;top:56px;z-index:10;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:7px;padding:9px 5px}
.cell{position:relative;aspect-ratio:1;border-radius:7px;overflow:hidden;cursor:pointer;
 background:#e6eaf0;border:2.5px solid transparent}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell:hover{border-color:#f5a623}
.cell.used{border-color:#1f9d55}
.cell.used::after{content:attr(data-pid);position:absolute;left:0;right:0;bottom:0;
 background:rgba(31,157,85,.94);color:#fff;font-size:9px;padding:3px 4px;font-weight:700;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zoom{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border-radius:5px;
 width:21px;height:21px;display:flex;align-items:center;justify-content:center;font-size:12px}
#hint{background:#fff6e6;border:1.5px solid #f5a623;border-radius:9px;padding:10px 13px;
 margin:0 5px 12px;font-size:12.5px;font-weight:600;color:#8a5a00}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;
 justify-content:center;z-index:200;padding:20px}
#modal.on{display:flex}#modal img{max-width:100%;max-height:92vh;border-radius:8px}
#out{display:none;padding:14px}
textarea{width:100%;height:230px;font:12px ui-monospace,Consolas,monospace;padding:11px;
 border:1.5px solid #d8dee7;border-radius:8px;resize:vertical}
</style></head><body>
<header>
  <h1>O4U — Photo Assigner</h1>
  <div class="bar"><i id="pbar"></i></div>
  <div class="stat" id="pstat">0 / 172</div>
  <button class="gho" onclick="undoLast()">Undo</button>
  <button class="pri" onclick="exportCsv()">Export for Excel</button>
</header>
<main>
  <div class="panel" id="left">
    <div class="phead">Products <span id="shown"></span></div>
    <div class="tools">
      <input type="search" id="q" placeholder="Search article, colour, type…" oninput="draw()"/>
      <div class="chips">
        <span class="chip on" data-f="todo" onclick="setF(this)">Needs photo</span>
        <span class="chip" data-f="done" onclick="setF(this)">Assigned</span>
        <span class="chip" data-f="all" onclick="setF(this)">All</span>
      </div>
    </div>
    <div id="plist"></div>
  </div>
  <div id="right">
    <div id="hint">Pick a product on the left, then click its photo →</div>
    <div id="photos"></div>
    <div class="panel" id="out">
      <div class="phead">Paste this into the Image column<button class="pri" onclick="copyOut()">Copy</button></div>
      <div style="padding:12px"><textarea id="ta" readonly></textarea></div>
    </div>
  </div>
</main>
<div id="modal" onclick="this.classList.remove('on')"><img id="mimg"/></div>

const IMG="stock images/O4u img/";
const KEY="o4u_photo_assign_v1";
let A={}, active=null, filt="todo", hist=[];
try{A=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){A={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(A))}catch(e){}};
const byPid=p=>PRODUCTS.find(x=>x.pid===p);
const owner=f=>Object.keys(A).find(k=>A[k]===f);

function setF(el){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');filt=el.dataset.f;draw();}

function list(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  return PRODUCTS.filter(p=>{
    if(filt==='todo'&&A[p.pid])return false;
    if(filt==='done'&&!A[p.pid])return false;
    if(!q)return true;
    return (p.art+' '+p.col+' '+p.type+' '+p.brand+' '+p.pid).toLowerCase().includes(q);
  });
}
function draw(){
  const L=list();
  document.getElementById('shown').textContent=L.length+' shown';
  document.getElementById('plist').innerHTML=L.map(p=>`
    <div class="pc ${A[p.pid]?'done':''} ${active===p.pid?'sel':''}" onclick="pick('${p.pid}')">
      ${A[p.pid]?`<img src="${IMG}${A[p.pid]}" loading="lazy">`:`<div class="ph">?</div>`}
      <div><div class="pn">${p.col||'—'} ${p.type}</div>
      <div class="pm">${p.art} · ${p.sizes||'no sizes'} · ₹${p.mrp}</div></div>
      ${A[p.pid]?'<span class="tick">✓</span>':''}
    </div>`).join('')||'<div style="padding:22px;text-align:center;color:#9aa5b3">Nothing matches</div>';
  const n=Object.keys(A).length;
  document.getElementById('pstat').textContent=n+' / '+PRODUCTS.length;
  document.getElementById('pbar').style.width=(n/PRODUCTS.length*100)+'%';
}
function drawPhotos(){
  document.getElementById('photos').innerHTML=GROUPS.map((g,i)=>{
    const t=g[0].replace('.jpg','').replace('_',' ');
    return `<div class="grp"><div class="gh"><span>Shoot ${i+1}</span><span>${g.length} photos</span>
      <span style="font-weight:400;color:#98a2b0">${t}</span></div>
      <div class="grid">${g.map(f=>{
        const o=owner(f);
        return `<div class="cell ${o?'used':''}" ${o?`data-pid="${o}"`:''} onclick="assign('${f}')">
          <img src="${IMG}${f}" loading="lazy" onerror="this.parentElement.style.opacity=.25">
          <div class="zoom" onclick="event.stopPropagation();zoom('${f}')">⤢</div></div>`;
      }).join('')}</div></div>`;
  }).join('');
}
function pick(pid){active=pid;const p=byPid(pid);
  document.getElementById('hint').textContent=`Assigning: ${p.col} ${p.type}  ·  ${p.art}  →  click its photo`;
  draw();}
function assign(f){
  if(!active){document.getElementById('hint').textContent='Pick a product on the left first ←';return;}
  const prev=owner(f); if(prev) delete A[prev];
  hist.push({pid:active,old:A[active]||null});
  A[active]=f; save();
  const L=list(); const i=L.findIndex(x=>x.pid===active);
  const nxt=L[i]&&L[i].pid===active?L[i+1]:L[i];
  active=nxt?nxt.pid:null;
  if(active){const p=byPid(active);
    document.getElementById('hint').textContent=`Assigning: ${p.col} ${p.type}  ·  ${p.art}  →  click its photo`;}
  else document.getElementById('hint').textContent='All done in this filter. Switch filter or export.';
  draw();drawPhotos();
}
function undoLast(){const h=hist.pop();if(!h)return;
  if(h.old)A[h.pid]=h.old;else delete A[h.pid];save();draw();drawPhotos();}
function zoom(f){document.getElementById('mimg').src=IMG+f;document.getElementById('modal').classList.add('on');}
function exportCsv(){
  const rows=['product_id,source_photo,rename_source_to,final_web_image'];
  PRODUCTS.forEach(p=>{if(A[p.pid])rows.push([p.pid,A[p.pid],p.pid+'__src.jpg',p.pid+'.jpg'].join(','));});
  document.getElementById('ta').value=rows.join('\n');
  document.getElementById('out').style.display='block';
  document.getElementById('out').scrollIntoView({behavior:'smooth'});
}
function copyOut(){const t=document.getElementById('ta');t.select();
  navigator.clipboard.writeText(t.value).then(()=>alert('Copied — paste into the Image Tracker sheet.'));}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').classList.remove('on');});
draw();drawPhotos();
</script></body></html>
