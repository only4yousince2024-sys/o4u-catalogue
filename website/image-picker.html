<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O4U Image Picker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #f5f5f5; color: #222; }
  header { background: #111; color: #fff; padding: 18px 24px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 20px; font-weight: 600; }
  header span { font-size: 13px; color: #aaa; }
  .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
  
  /* Product list sidebar */
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 24px; }
  .sidebar { position: sticky; top: 24px; height: fit-content; }
  .product-card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; 
                   border: 2px solid transparent; cursor: pointer; transition: all .15s; }
  .product-card:hover { border-color: #ddd; }
  .product-card.active { border-color: #111; background: #f9f9f9; }
  .product-card.assigned { border-color: #22c55e; }
  .product-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .product-meta { font-size: 12px; color: #777; }
  .product-preview { width: 60px; height: 70px; object-fit: cover; border-radius: 6px; float: right; margin-left: 10px; }
  .assigned-badge { display: inline-block; background: #dcfce7; color: #16a34a; font-size: 11px; 
                     padding: 2px 8px; border-radius: 20px; margin-top: 4px; }
  
  /* Photo groups */
  .main { }
  .group-section { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .group-header { font-weight: 600; font-size: 14px; margin-bottom: 14px; color: #555; display: flex; 
                   align-items: center; gap: 10px; }
  .group-count { background: #eee; border-radius: 20px; padding: 2px 10px; font-size: 12px; }
  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .photo-item { position: relative; cursor: pointer; border-radius: 8px; overflow: hidden; 
                 border: 3px solid transparent; transition: all .15s; aspect-ratio: 3/4; }
  .photo-item:hover { border-color: #aaa; }
  .photo-item.selected { border-color: #111; }
  .photo-item.assigned-to { border-color: #22c55e; }
  .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-label { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.75); 
                  color: #fff; font-size: 10px; padding: 4px 6px; line-height: 1.3; }
  .photo-assign-tag { position: absolute; top: 4px; right: 4px; background: #22c55e; color: white; 
                       font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: 600; }

  /* Action bar */
  .action-bar { background: #111; color: #fff; padding: 14px 24px; position: sticky; bottom: 0; 
                 display: flex; align-items: center; gap: 16px; }
  .action-bar .progress { flex: 1; }
  .action-bar .progress-text { font-size: 13px; color: #aaa; margin-bottom: 6px; }
  .progress-bar { height: 4px; background: #333; border-radius: 2px; }
  .progress-fill { height: 100%; background: #22c55e; border-radius: 2px; transition: width .3s; }
  .btn-generate { background: #fff; color: #111; border: none; padding: 10px 24px; border-radius: 8px; 
                   font-weight: 600; font-size: 14px; cursor: pointer; }
  .btn-generate:hover { background: #f0f0f0; }
  .btn-generate:disabled { opacity: .4; cursor: not-allowed; }

  /* Modal */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; 
            align-items: center; justify-content: center; }
  .modal.open { display: flex; }
  .modal img { max-height: 90vh; max-width: 90vw; object-fit: contain; border-radius: 8px; }
  .modal-close { position: absolute; top: 20px; right: 20px; color: #fff; font-size: 28px; 
                  cursor: pointer; background: none; border: none; }

  /* Output */
  .output-box { display: none; background: #1e1e1e; color: #d4d4d4; padding: 20px; 
                 border-radius: 12px; font-family: monospace; font-size: 12px; 
                 white-space: pre; overflow-x: auto; margin-top: 20px; }
  .copy-btn { background: #333; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; 
               cursor: pointer; font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>O4U Image Picker</h1>
    <span>Assign product photos → generates updated products.js</span>
  </div>
</header>

<div class="container">
  <div class="layout">
    <!-- Sidebar: products -->
    <div class="sidebar">
      <div style="font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:#999; margin-bottom:12px;">Products (12)</div>
      <div id="product-list"></div>
      <div style="margin-top:16px; font-size:12px; color:#999; line-height:1.6;">
        Click a product → then click a photo to assign it. You can pick any photo from any group.
      </div>
    </div>

    <!-- Main: photo groups -->
    <div class="main" id="photo-groups"></div>
  </div>
  
  <div id="output-section" style="display:none">
    <h2 style="margin:24px 0 12px; font-size:16px;">✅ Generated products.js — copy & save to your website folder</h2>
    <button class="copy-btn" onclick="copyOutput()">📋 Copy to clipboard</button>
    <div class="output-box" id="output-box"></div>
  </div>
</div>

<!-- Action bar -->
<div class="action-bar">
  <div class="progress">
    <div class="progress-text" id="progress-text">0 of 12 products assigned</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <button class="btn-generate" id="btn-generate" onclick="generateProductsJs()" disabled>
    Generate products.js
  </button>
</div>

<!-- Lightbox modal -->
<div class="modal" id="modal" onclick="closeModal()">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <img id="modal-img" src="" alt="">
</div>

// State
let activeProduct = null;        // product id currently being assigned
let assignments = {};            // product_id -> filename

function init() {
  renderProducts();
  renderGroups();
}

function renderProducts() {
  const el = document.getElementById('product-list');
  el.innerHTML = PRODUCTS.map(p => `
    <div class="product-card ${assignments[p.id] ? 'assigned' : ''}" 
         id="pcard-${p.id}" onclick="selectProduct('${p.id}')">
      ${assignments[p.id] ? `<img class="product-preview" src="${IMG_BASE}${assignments[p.id]}" onerror="this.style.display='none'">` : ''}
      <div class="product-name">${p.name}</div>
      <div class="product-meta">₹${p.price} · ${p.category}</div>
      ${assignments[p.id] ? `<div class="assigned-badge">✓ assigned</div>` : ''}
    </div>
  `).join('');
}

function renderGroups() {
  const el = document.getElementById('photo-groups');
  el.innerHTML = GROUPS.map((group, gi) => `
    <div class="group-section">
      <div class="group-header">
        <span>Group ${gi+1}</span>
        <span class="group-count">${group.length} photos</span>
        <span style="font-weight:400; color:#999">${group[0].replace('.jpg','').replace('_',' ')}</span>
      </div>
      <div class="photo-grid">
        ${group.map(f => `
          <div class="photo-item ${isAssigned(f) ? 'assigned-to' : ''}" 
               id="photo-${f.replace('.','_')}"
               onclick="assignPhoto('${f}')" 
               ondblclick="openModal('${f}')">
            <img src="${IMG_BASE}${f}" loading="lazy" onerror="this.parentElement.style.display='none'">
            <div class="photo-label">${f.slice(9,15)}</div>
            ${isAssigned(f) ? `<div class="photo-assign-tag">${getAssignedProduct(f)}</div>` : ''}
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function selectProduct(pid) {
  activeProduct = pid;
  document.querySelectorAll('.product-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('pcard-' + pid);
  if (card) { card.classList.add('active'); card.scrollIntoView({behavior:'smooth', block:'nearest'}); }
  // Visual hint
  document.body.style.cursor = 'crosshair';
}

function assignPhoto(filename) {
  if (!activeProduct) {
    alert('First click a product on the left, then click a photo to assign it.');
    return;
  }
  // Remove previous assignment for this product
  Object.keys(assignments).forEach(k => {
    if (assignments[k] === filename) delete assignments[k];
  });
  assignments[activeProduct] = filename;
  
  const nextUnassigned = PRODUCTS.find(p => !assignments[p.id] && p.id !== activeProduct);
  if (nextUnassigned) selectProduct(nextUnassigned.id);
  else { activeProduct = null; document.body.style.cursor = ''; }

  updateProgress();
  renderProducts();
  renderGroups();
}

function isAssigned(filename) {
  return Object.values(assignments).includes(filename);
}

function getAssignedProduct(filename) {
  const pid = Object.keys(assignments).find(k => assignments[k] === filename);
  if (!pid) return '';
  const p = PRODUCTS.find(x => x.id === pid);
  return p ? p.id : pid;
}

function updateProgress() {
  const count = Object.keys(assignments).length;
  const pct = Math.round(count / PRODUCTS.length * 100);
  document.getElementById('progress-text').textContent = count + ' of ' + PRODUCTS.length + ' products assigned';
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('btn-generate').disabled = count === 0;
}

function openModal(filename) {
  document.getElementById('modal-img').src = IMG_BASE + filename;
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }

    {id:"w6",  name:"Jungle Green Night Suit",       category:"round-neck",    price:1195, sizes:["S","M","L"],colors:["Jungle Green"], inStock:true},
    {id:"w7",  name:"E.Grey Kurta Set",              category:"salwar-set",    price:1545, sizes:["XL","2XL"], colors:["E.Grey"],       inStock:true},

  ];

  fullProducts.forEach((p, i) => {
    const imgFile = assignments[p.id] || 'placeholder.jpg';
    const imgPath = assignments[p.id] ? 'images/' + imgFile : 'images/placeholder.jpg';
    const desc = p.name + '. Soft & comfortable fabric.';
    const obj = `  {
    id:          "${p.id}",
    name:        "${p.name}",
    category:    "${p.category}",
    price:       ${p.price},
    mrp:         null,
    image:       "${imgPath}",
    description: "${desc}",
    badge:       "",
    badgeStyle:  "",
    sizes:       ${JSON.stringify(p.sizes)},
    colors:      ${JSON.stringify(p.colors)},
    inStock:     ${p.inStock}
  }`;
    lines.push(obj + (i < fullProducts.length - 1 ? ',' : ''));
  });
  
  lines.push('];');
  lines.push('');
  
  const output = lines.join('\n');
  document.getElementById('output-box').textContent = output;
  document.getElementById('output-section').style.display = 'block';
  document.getElementById('output-section').scrollIntoView({behavior:'smooth'});
}

function copyOutput() {
  const text = document.getElementById('output-box').textContent;
  navigator.clipboard.writeText(text).then(() => alert('Copied! Now paste into products.js in your website folder.'));
}
