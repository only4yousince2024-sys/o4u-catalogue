<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ordering, Delivery &amp; Exchanges | Only 4 You</title>
  <meta name="description" content="How ordering, payment, delivery and exchanges work at Only 4 You, Pakhowal Road, Ludhiana.">
  <link rel="canonical" href="https://only4you-store.netlify.app/policy.html">
  <meta name="theme-color" content="#1b2430">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet"/>
  <!-- All wording comes from config.js (the same source as the shop page). -->
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #EDEAE3; --card: #F5F2EC; --white: #FAFAF8; --black: #111110; --orange: #E5611C; --brown: #5C3D2E; --gray: #6B655E; --light: #D8D4CC; }
    body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--black); line-height: 1.6; }
    a { color: var(--brown); font-weight: 700; text-underline-offset: 3px; }
    :focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; background: rgba(237,234,227,0.96); border-bottom: 1px solid rgba(0,0,0,0.07); position: sticky; top: 0; }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--black); font-weight: 600; letter-spacing: 3px; font-size: 0.82rem; }
    .brand img { width: 34px; height: 34px; }
    .brand span { color: var(--orange); }
    main { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 600; font-size: clamp(1.7rem, 6vw, 2.3rem); line-height: 1.2; margin-bottom: 8px; }
    .lead { color: var(--gray); margin-bottom: 28px; }
    section { background: var(--white); border: 1px solid var(--light); border-radius: 16px; padding: 18px 20px; margin-bottom: 14px; }
    h2 { font-size: 1rem; font-weight: 700; margin-bottom: 8px; }
    section p + p { margin-top: 8px; }
    ul { padding-left: 20px; }
    li + li { margin-top: 6px; }
    .contact { color: var(--gray); font-size: 0.9rem; margin-top: 22px; }
    @media (max-width: 400px) { main { padding: 24px 16px 48px; } header { padding: 12px 16px; } section { padding: 16px; } }
  </style>
</head>
<body>
<header>
  <a class="brand" href="./"><img src="images/logo-round.png" alt="" onerror="this.onerror=null;this.src='images/logo.png'"/>ONLY <span>4</span> YOU</a>
  <a href="./">← Back to the shop</a>
</header>
<main>
  <h1>Ordering, delivery &amp; exchanges</h1>
  <p class="lead" data-copy="positioning"></p>

  <section aria-labelledby="h-order">
    <h2 id="h-order">How ordering works</h2>
    <p data-copy="orderRequest"></p>
    <p data-copy="whatsappNote"></p>
  </section>

  <section aria-labelledby="h-pay">
    <h2 id="h-pay">Payment</h2>
    <p data-copy="payment"></p>
  </section>

  <section aria-labelledby="h-delivery">
    <h2 id="h-delivery">Delivery</h2>
    <p data-copy="deliveryArea"></p>
    <p data-copy="delivery"></p>
  </section>

  <section aria-labelledby="h-prices">
    <h2 id="h-prices">Prices</h2>
    <p data-copy="pricing"></p>
  </section>

  <section aria-labelledby="h-exchange">
    <h2 id="h-exchange" data-copy="exchangeTitle"></h2>
    <ul data-copy="exchange"></ul>
  </section>

  <p class="contact">Questions? Message us on WhatsApp at <a href="#" data-wa="" data-wa-display target="_blank" rel="noopener">+91 81465 97775</a>, or visit the shop on Pakhowal Road, Ludhiana.</p>
</main>
<script>
  applyCopy();
  applyWhatsAppLinks();
</script>
</body>
</html>
