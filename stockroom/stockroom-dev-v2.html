<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>O4U Stockroom (DEV COPY v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#E8E2D8; --surface:#F4F0E9; --raised:#FFFFFF; --ink:#1A1A1A; --ink-2:#5B554C; --ink-3:#8C857A;
  --line:#D3CBBE; --accent:#E05A1C; --accent-ink:#FFFFFF; --accent-soft:#F6DCCD;
  --ok:#2F7A4B; --ok-soft:#DCEBDF; --warn:#9A6200; --warn-soft:#F5E6C4; --bad:#B3261E; --bad-soft:#F6D9D6;
  --slot:#E0D9CD;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#171513; --surface:#211E1B; --raised:#2A2622; --ink:#EFE9DF; --ink-2:#B5AC9F; --ink-3:#847B70;
    --line:#3A3530; --accent:#F07236; --accent-ink:#1A1A1A; --accent-soft:#3D2519;
    --ok:#7CC495; --ok-soft:#1E3326; --warn:#E3B55A; --warn-soft:#3A2F17; --bad:#F08C84; --bad-soft:#3E1F1C;
    --slot:#2E2A26;
  }
}
:root[data-theme="dark"]{
  --ground:#171513; --surface:#211E1B; --raised:#2A2622; --ink:#EFE9DF; --ink-2:#B5AC9F; --ink-3:#847B70;
  --line:#3A3530; --accent:#F07236; --accent-ink:#1A1A1A; --accent-soft:#3D2519;
  --ok:#7CC495; --ok-soft:#1E3326; --warn:#E3B55A; --warn-soft:#3A2F17; --bad:#F08C84; --bad-soft:#3E1F1C;
  --slot:#2E2A26;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 120px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.wordmark{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em;margin:0}
.wordmark b{color:var(--accent);font-weight:700}
.wordmark span{font-weight:500;color:var(--ink-2)}
.tally{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.controls{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.search{width:100%;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.7;margin-left:4px}

/* list */
.banner{margin-top:14px;padding:10px 12px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:13px}
.list{display:flex;flex-direction:column;margin-top:8px}
.row{display:grid;grid-template-columns:64px 1fr;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.thumb{width:64px;height:84px;border-radius:6px;background:var(--slot);object-fit:cover;display:block}
.thumb.empty{display:grid;place-items:center;color:var(--ink-3);font-size:10px;text-align:center;line-height:1.2}
.row .pid{font-family:var(--mono);font-size:12px;color:var(--ink-2);word-break:break-all}
.row .name{font-weight:600;margin-top:2px}
.row .meta{font-size:13px;color:var(--ink-2)}
.row .foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:8px}
.strip{display:flex;gap:3px;align-items:center}
.strip i{width:18px;height:18px;border-radius:3px;background:var(--slot);display:block;background-size:cover;background-position:center}
.strip i.on{outline:1px solid var(--line)}
.strip small{margin-left:4px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pill{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--slot);color:var(--ink-2)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.empty-state{padding:48px 8px;text-align:center;color:var(--ink-2)}
.empty-state h2{font-family:var(--display);font-weight:500;font-size:20px;color:var(--ink);margin:0 0 6px}

/* fab */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 22px;font-weight:600;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.fab svg{width:20px;height:20px}

/* sheets */
.sheet{position:fixed;inset:0;z-index:10;background:var(--ground);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--ground);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-family:var(--display);font-weight:500;font-size:19px;margin:0;text-wrap:balance}
.sheet-body{max-width:760px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:22px}
.x{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}
.label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px}
.hint{font-size:13px;color:var(--ink-2);margin:6px 0 0}

.shots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shot{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:var(--r);border:1.5px dashed var(--line);background:var(--surface);display:grid;place-items:center;text-align:center;padding:10px;overflow:hidden}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .cap{position:relative;display:flex;flex-direction:column;gap:6px;align-items:center;color:var(--ink-2);font-size:13px}
.shot .cap strong{color:var(--ink);font-size:15px}
.shot svg{width:28px;height:28px;color:var(--accent)}
.shot .tagx{position:absolute;top:6px;right:6px;z-index:1;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:999px;width:28px;height:28px}
.shot.filled{border-style:solid}
.tagrow{display:flex;gap:8px;overflow-x:auto;margin-top:10px}
.tagrow .shot{flex:none;width:90px;aspect-ratio:3/4}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;opacity:0}
.pick{position:relative;display:flex;gap:6px;margin-top:8px}
.pbtn{flex:1;text-align:center;padding:10px 4px;border-radius:8px;border:1px solid var(--line);background:var(--raised);font-size:14px;font-weight:600;cursor:pointer;user-select:none}
.pbtn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.shotcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.shot.big{cursor:pointer;border-width:2px}
.shot.big .cap strong{font-size:18px}
.shot.big svg{width:40px;height:40px}
.retake{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;padding:6px}
.shotcol .pbtn{display:block;padding:13px 4px;font-size:16px}
.shot.addtag{cursor:pointer;flex:none;width:90px}
.shot.addtag .cap{font-size:12px}
.step{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:0 0 12px;font-family:var(--display);font-weight:500;font-size:20px}
.step b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--ground);font-size:15px;font-family:var(--body)}
.step span{font-family:var(--body);font-size:14px;color:var(--ink-2);font-weight:400}
.sizegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sizegrid.small{gap:6px}
.sizegrid.small .szplus{padding:8px 4px}
.colcard{border:1.5px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.colhead{display:flex;gap:12px;align-items:flex-start}
.colhead img{width:64px;height:84px;object-fit:cover;border-radius:10px;flex:none}
.colstrip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.colchip{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;min-width:72px;font-size:13px;color:inherit}
.colchip img,.colchip .thumb{width:64px;height:84px;object-fit:cover;border-radius:10px}
.szbox{position:relative}
.szplus{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--raised)}
.szname{font-weight:600;font-size:17px}
.szn{font-size:22px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums;line-height:1.1}
.szbox.on .szplus{border-color:var(--accent);background:var(--accent-soft)}
.szbox.on .szn{color:var(--accent)}
.szminus{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:var(--ink);color:var(--ground);font-size:20px;line-height:1}
.total{margin:10px 0 0;font-size:16px}
.savebar{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.btn.big{padding:18px 16px;font-size:18px}
.linkbtn{background:none;border:0;color:var(--ink-2);text-decoration:underline;padding:10px;font-size:14px}
.linkbtn:disabled{opacity:.45}
.photogrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}
.photogrid .shot{aspect-ratio:3/4;padding:4px;width:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--raised);padding:14px 8px;font-size:16px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.web .pos{position:absolute;top:4px;left:4px;z-index:1;min-width:22px;height:22px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 6px}
.web.drag{cursor:grab;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.web img{-webkit-user-drag:none}
.web.lifted{opacity:.3}
.web.target{outline:3px solid var(--accent);outline-offset:-3px}
.dragghost{position:fixed;z-index:50;pointer-events:none;border-radius:8px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35);transform:scale(1.05);opacity:.95}
.dragghost img{width:100%;height:100%;object-fit:cover;display:block}
.thumbbtn{border:0;padding:0;background:none;flex:none;cursor:pointer;border-radius:6px}
.thumbbtn img{display:block}
.exportbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:var(--r);background:var(--surface);font-size:14px}
.live{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
.live video{flex:1;width:100%;min-height:0;object-fit:contain;background:#000}
.livemsg{position:absolute;top:40%;left:16px;right:16px;text-align:center;color:#fff;font-size:15px}
.livebar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.livetop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px}
.livetop .seg{flex:1;max-width:260px}
.livebtn{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:999px;padding:12px 20px;font-size:16px;min-width:84px}
.livebtn[aria-pressed="true"]{background:#fff;color:#000}
.livecount{color:#fff;font-size:14px;min-width:84px}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25);flex:none}
.shutter:active{background:#fff}
.shutter:disabled{opacity:.5}
.liveflash{position:absolute;inset:0;background:#fff;opacity:.6;pointer-events:none}
.shutter{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:var(--accent)}

.btn{border:0;border-radius:var(--r);padding:13px 16px;font-weight:600;font-size:15px;width:100%}
.btn.primary{background:var(--ink);color:var(--ground)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tagchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{border:1.5px solid var(--line);background:var(--raised);border-radius:999px;padding:10px 16px;font-size:15px;font-weight:600;min-height:44px}
.tchip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.backup{margin:32px 0 120px;padding:14px;border:1px dashed var(--line);border-radius:var(--r)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}

.status{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:var(--r);background:var(--surface);font-size:14px}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none;margin-top:2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation:none}}

.idcard{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.idcard .id{font-family:var(--mono);font-size:17px;font-weight:500;word-break:break-all}
.idcard .files{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);margin-top:6px;line-height:1.6;word-break:break-all}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;padding:10px 11px;border-radius:8px;border:1px solid var(--line);background:var(--raised);min-width:0}
.field textarea{min-height:64px;resize:vertical}
.field input.mono{font-family:var(--mono)}

.sizes{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--raised)}
.sizes .sz{display:grid;grid-template-columns:1fr 1.2fr 1.6fr 36px;gap:6px;padding:8px;border-bottom:1px solid var(--line);align-items:center}
.sizes .sz:last-child{border-bottom:0}
.sizes .sz.h{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:var(--surface)}
.sizes input{width:100%;min-width:0;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--raised);font-variant-numeric:tabular-nums}
.sizes .rm{background:none;border:0;color:var(--ink-3);font-size:18px}
.addsz{background:none;border:0;color:var(--accent);font-weight:600;padding:10px 0 0}

.flags{display:flex;flex-direction:column;gap:6px}
.flags div{display:flex;gap:8px;font-size:14px;color:var(--warn);background:var(--warn-soft);padding:8px 10px;border-radius:8px}

.toggles{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--raised)}
.tg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.tg:last-child{border-bottom:0}
.tg small{display:block;color:var(--ink-2);font-size:12px}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--slot);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--raised);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked + span{background:var(--ok)}
.switch input:checked + span::after{transform:translateX(18px)}
.switch input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}

.compare{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:12px;align-items:start}
.compare .refimg{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r);background:var(--slot);display:block}
.webgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.web{position:relative;aspect-ratio:3/4;border-radius:8px;background:var(--slot);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.web img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.web .fn{position:relative;font-family:var(--mono);font-size:9.5px;padding:3px 5px;background:rgba(0,0,0,.55);color:#fff;word-break:break-all;line-height:1.25}
.web.add{border:1.5px dashed var(--line);background:var(--surface);align-items:center;justify-content:center;color:var(--ink-2);font-size:12px;text-align:center}
.web.add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.web .del{position:absolute;top:4px;right:4px;z-index:1;border:0;border-radius:999px;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff;font-size:13px}
.web .main{position:absolute;top:4px;left:4px;z-index:1}
.tagthumbs{display:flex;gap:8px;overflow-x:auto;margin-top:8px}
.tagthumbs img{width:64px;height:84px;object-fit:cover;border-radius:6px;background:var(--slot);flex:none}
.brief{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;white-space:pre-wrap;color:var(--ink-2)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);text-align:center}

@media (max-width:420px){
  .compare{grid-template-columns:1fr}
  .compare .refimg{max-width:220px}
  .webgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* ---------- O4U operations: tabs + Inventory / Orders / Exchanges / Dashboard ---------- */
.wrap{padding-block:0 200px}
.toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.fab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body:not([data-tab="capture"]) #capControls,
body:not([data-tab="capture"]) #capMain,
body:not([data-tab="capture"]) #fab,
body:not([data-tab="capture"]) #tally{display:none!important}
body[data-tab="capture"] .opspage,
body[data-tab="capture"] #opsWho{display:none!important}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--raised);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;background:none;border:0;color:var(--ink-2);font-size:11.5px;font-weight:600;min-height:62px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;font-variant-numeric:tabular-nums}

.who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.who select{border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:5px 10px;font-weight:600}

.opspage{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 200px;display:flex;flex-direction:column;gap:14px}
.ophead{display:flex;flex-direction:column;gap:10px}
.ophead h2{font-family:var(--display);font-weight:500;font-size:22px;margin:0}
.ophead .sub{font-size:13px;color:var(--ink-2);margin:0}
.oprow{display:flex;gap:8px;align-items:center}
.oprow > *{min-width:0}
.oprow .search{flex:1}
.oprow select{padding:10px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);max-width:46%}
.note{font-size:13px;color:var(--ink-2);background:var(--surface);border-radius:var(--r);padding:10px 12px;margin:0}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ok)}

/* inventory rows */
.inv{display:flex;flex-direction:column}
.irow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.irow .thumb{width:52px;height:68px}
.irow .name{font-weight:600}
.irow .meta{font-size:13px;color:var(--ink-2)}
.szline{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.sz1{font-size:12px;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--surface)}
.sz1 b{font-weight:700}
.sz1.zero{color:var(--ink-3);border-style:dashed;background:none}
.sz1.held{border-color:var(--warn);color:var(--warn)}
.iprice{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.iprice s{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.iprice .pill{display:inline-block;margin-top:4px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 6px;border-bottom:1px solid var(--line)}
.tbl td.n,.tbl th.n{text-align:right}
.tblwrap{overflow-x:auto;background:var(--raised);border:1px solid var(--line);border-radius:var(--r)}

/* big choice buttons, steppers */
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.pickbtn{border:1.5px solid var(--line);background:var(--raised);border-radius:var(--r);padding:12px 6px;font-weight:600;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px}
.pickbtn small{font-weight:500;font-size:12px;color:var(--ink-2)}
.pickbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pickbtn:disabled{opacity:.4}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--raised);font-size:24px;line-height:1}
.stepper output{min-width:44px;text-align:center;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stepgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.steprow{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--raised)}
.steprow .stepper button{width:40px;height:40px;font-size:20px}
.steprow .stepper output{font-size:20px;min-width:32px}
.steprow b{font-size:16px}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--raised)}
.swrow p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--raised);font-size:15px}
.check input{width:24px;height:24px;flex:none;margin:0;accent-color:var(--accent)}
.hist{display:flex;flex-direction:column}
.hist .ev{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.hist .ev .w{color:var(--ink-2)}
.hist .ev .d{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.d.minus{color:var(--bad)}.d.plus{color:var(--ok)}
.sect{display:flex;flex-direction:column;gap:10px}
.sect > .label{margin:0}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formgrid .full{grid-column:1/-1}
.field input[type="datetime-local"]{min-height:44px}
.empty-ops{padding:40px 8px;text-align:center;color:var(--ink-2)}
.empty-ops h3{font-family:var(--display);font-weight:500;font-size:19px;color:var(--ink);margin:0 0 6px}
@media (max-width:420px){.formgrid{grid-template-columns:1fr}}
.actcol{display:flex;flex-direction:column;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.tile .tl{font-size:12px;font-weight:600;color:var(--ink-2)}
.tile .tv{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.tile .ts{font-size:12px;color:var(--ink-2)}
.tile.warn{border-color:var(--warn)}.tile.warn .tv{color:var(--warn)}
.tile.bad{border-color:var(--bad)}.tile.bad .tv{color:var(--bad)}
.chartbox{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:13px}
.bar .bt{height:14px;background:var(--slot);border-radius:4px;overflow:hidden}
.bar .bt i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.bar .bn{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

.scroll{overflow-x:auto;max-height:70vh;border:1px solid var(--line);border-radius:var(--r);background:var(--raised)}
.matrix{border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums;min-width:100%}
.matrix th,.matrix td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center}
.matrix th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);background:var(--surface);position:sticky;top:0;z-index:1}
.matrix td.nm,.matrix th.nm{text-align:left;position:sticky;left:0;background:var(--raised);max-width:170px;overflow:hidden;text-overflow:ellipsis}
.matrix th.nm{background:var(--surface);z-index:2}
.matrix td.nm small{display:block;font-family:var(--mono);font-size:10.5px}
.matrix td.z{color:var(--ink-3)}
.matrix td small{display:block;color:var(--warn);font-size:10px}
/* ---------- Dashboard v2 + app shell (sidebar on desktop, bottom bar on phones) ----------
   Direction: a calm, premium admin look. Light warm-grey canvas, white cards with a soft shadow, generous spacing,
   one orange accent, tabular numerals. Status colour appears only on status. No gradients. Dark mode follows the system. */
:root{ --c-counter:#2B2723; --c-web:#E05A1C; --c-wa:#5E7C8A; --card:#FFFFFF; --accent-text:#B3410F;
  --d-shadow:0 1px 2px rgba(31,24,12,.05),0 10px 24px -16px rgba(31,24,12,.18); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --c-counter:#D9D2C6; --c-web:#F07236; --c-wa:#8FB0BF; --card:#1F1C19; --accent-text:#F5936A; --d-shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -16px rgba(0,0,0,.6); } }
:root[data-theme="dark"]{ --c-counter:#D9D2C6; --c-web:#F07236; --c-wa:#8FB0BF; --card:#1F1C19; --accent-text:#F5936A; --d-shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -16px rgba(0,0,0,.6); }
body[data-tab="dashboard"]{ --ground:#F4F2EE; --line:#E9E4DB; --surface:#FAF8F5; --slot:#EDE8DF; background:var(--ground); }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body[data-tab="dashboard"]{ --ground:#14120F; --line:#2D2924; --surface:#1A1714; --slot:#2A2622; } }
:root[data-theme="dark"] body[data-tab="dashboard"]{ --ground:#14120F; --line:#2D2924; --surface:#1A1714; --slot:#2A2622; }

#pg-dashboard{max-width:1380px;padding:18px 16px 200px}
.dv2{display:flex;flex-direction:column;gap:18px}
.dv2 h2{font-family:var(--display);font-weight:700;letter-spacing:-.02em;margin:0}
.greet{margin:0;font-size:13px;color:var(--ink-2)}
.sub{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.dtop{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.dtop h2{font-size:28px;margin-top:2px}
.dtools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.viewas{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.viewas select{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:7px 10px;font-weight:600;font-size:13px}
.rolechip{font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text)}
.seg2{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg2 button{border:0;background:none;padding:7px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2);min-height:34px}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.seg2.small button{padding:4px 11px;font-size:12px;min-height:28px}
.dates{display:flex;flex-wrap:wrap;gap:10px}
.dates label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.dates input{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}

.kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(176px,1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;box-shadow:var(--d-shadow);min-width:0}
.kpi .kl{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .kv{font-family:var(--body);font-weight:700;font-size:27px;letter-spacing:-.02em;margin-top:6px;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .ks{font-size:12px;color:var(--ink-2);margin-top:4px;line-height:1.35}
.kpi .spark{display:block;width:100%;height:22px;margin-top:10px}
.kpi.warn .kv{color:var(--warn)} .kpi.bad{border-color:var(--bad)} .kpi.bad .kv{color:var(--bad)}
.dpill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.dpill.up{background:var(--ok-soft);color:var(--ok)} .dpill.dn{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--ink-2);font-size:12px}

.grid2{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1024px){ .grid2.a{grid-template-columns:minmax(0,1fr) 370px} .grid2.b{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)} .grid2.c{grid-template-columns:1fr 1fr} .grid2{align-items:start} }
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.dp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--d-shadow);min-width:0}
.dp .dh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.dp h3{font-family:var(--display);font-weight:600;font-size:16px;margin:0;letter-spacing:-.005em}
.badge{font-size:12px;font-weight:700;min-width:22px;padding:2px 8px;border-radius:999px;background:var(--slot);color:var(--ink-2);text-align:center}
.badge.bad{background:var(--bad);color:#fff}
.x{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.mini{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin:14px 0 6px}
.db > .mini:first-child{margin-top:0}
.empty{margin:0;padding:18px 4px;text-align:center;color:var(--ink-2);font-size:14px}.empty.ok{color:var(--ok)}
.hint{margin:6px 0 0;font-size:12px;color:var(--ink-2)}
.linkbtn{background:none;border:0;color:var(--accent-text);font-weight:700;font-size:13px;padding:10px 2px 0}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}

/* analytics */
.sumline{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sumline .big,.hero .big{font-family:var(--body);font-weight:700;font-size:32px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.sumr{text-align:right}
.chartwrap{position:relative}
.tip{position:absolute;z-index:3;width:160px;background:var(--ink);color:var(--ground);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.5;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.tip i,.legend i,.splitkey i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2);margin-top:6px}
.split{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--slot);margin-top:14px;gap:2px}
.split i{display:block;height:100%}
.splitkey{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-size:12px;color:var(--ink-2)}
.splitkey b{color:var(--ink);font-variant-numeric:tabular-nums} .splitkey em{font-style:normal}
details.plain{margin-top:10px;font-size:13px} details.plain summary{cursor:pointer;color:var(--ink-2)}

/* lists */
.alist{display:flex;flex-direction:column}
.arow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;grid-template-areas:"p t go" "p s go";gap:1px 10px;text-align:left;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px;min-height:50px;align-items:center}
.alist .arow:first-child{border-top:0}
.arow.flat{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t go" "s go"}
.arow .pri{grid-area:p;width:8px;height:8px;border-radius:50%;background:var(--ink-3);align-self:start;margin-top:6px}
.pri.p0{background:var(--bad)} .pri.p1{background:var(--warn)} .pri.p2{background:var(--warn)} .pri.p3{background:var(--ink-3)}
.arow .at{grid-area:t;font-weight:600;font-size:14px;overflow-wrap:anywhere;line-height:1.3}
.arow .as{grid-area:s;font-size:12px;color:var(--ink-2);line-height:1.35}
.arow .chev{grid-area:go;font-size:12px;font-weight:700;color:var(--accent-text);white-space:nowrap}
.arow:hover{background:var(--surface)}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:6px}
.stats4.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats4 > div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.stats4 b{font-size:20px;font-variant-numeric:tabular-nums} .stats4 span{font-size:11px;color:var(--ink-2)} .stats4 .bad b{color:var(--bad)}
.olist{display:flex;flex-direction:column}
.orow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"a b" "c d";gap:2px 12px;text-align:left;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px;align-items:center}
.olist .orow:first-child{border-top:0} .orow:hover{background:var(--surface)}
.orow .o1{grid-area:a;font-size:14px;overflow-wrap:anywhere}.orow .o2{grid-area:b;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.orow .o3{grid-area:c;font-size:12px;color:var(--ink-2)}.orow .o4{grid-area:d;font-size:12px;color:var(--ink-2);text-align:right}
.src{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--slot);color:var(--ink-2);margin-right:4px}
.src.site{background:var(--accent-soft);color:var(--accent-text)}
.hrow{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)} .hrow:first-child{border-top:0} .hrow b{font-size:14px}
.hd{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px;background:var(--ink-3)}
.hd.ok{background:var(--ok)}.hd.warn{background:var(--warn)}.hd.bad{background:var(--bad)}.hd.mute{background:var(--slot);outline:1px solid var(--ink-3)}
.two{display:grid;grid-template-columns:1fr;gap:18px;margin-bottom:6px}
@media (min-width:1280px){ .two{grid-template-columns:1fr 1fr;gap:26px} }
.chips2{display:flex;flex-wrap:wrap;gap:6px}
.fin .frow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.fin .frow:first-child{border-top:0} .fin .frow.tot{font-weight:700}
.fin .frow.soft{color:var(--ink-2);font-size:13px;flex-direction:column;gap:2px} .fin .frow.soft em{font-style:normal}
.defs{margin:0;padding-left:18px;font-size:13px;color:var(--ink-2);line-height:1.5}.defs li{margin-bottom:8px}
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qa button{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-weight:700;font-size:14px;text-align:left;min-height:56px}
.qa svg{width:22px;height:22px;color:var(--accent-text);flex:none}
.note{margin:0}

/* phone layouts */
.mtop{display:flex;justify-content:space-between;align-items:center;gap:8px 10px;flex-wrap:wrap}
.mtop .viewas select{max-width:150px}
.hero .splitkey i{box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.mtop h2{font-size:24px}
.chipscroll{overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.chipscroll .seg2{display:flex;width:max-content}
.hero{background:var(--ink);color:var(--ground);border-radius:20px;padding:18px 18px 16px;position:relative}
.hero .kl{font-size:12px;font-weight:600;opacity:.75}
.hero .muted,.hero .splitkey,.hero .splitkey b{color:inherit}.hero .muted{opacity:.7}
.hero .dpill.up{background:rgba(124,196,149,.18);color:#7CC495}.hero .dpill.dn{background:rgba(240,140,132,.18);color:#F08C84}
.hero .spark{position:absolute;right:16px;top:20px;width:92px;height:30px}
.hero .split{background:rgba(255,255,255,.16)}
.hero .splitkey{opacity:.9}
:root:not([data-theme="dark"]) .hero .splitkey i[style*="--c-counter"]{box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.mini4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini4 .kpi{padding:12px 14px}.mini4 .kv{font-size:22px}
details.acc{padding:0}
details.acc > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:16px 18px;min-height:56px}
details.acc > summary::-webkit-details-marker{display:none}
details.acc > summary h3{flex:1}
details.acc > summary::after{content:"+";font-size:22px;color:var(--ink-2);line-height:1}
details.acc[open] > summary::after{content:"−"}
details.acc > .db{padding:0 18px 18px}

/* app shell: desktop sidebar */
.sb-brand,.sb-user{display:none}
@media (min-width:1024px){
  body{padding-left:236px}
  #pg-dashboard{padding:26px 36px 60px}
  .opspage{padding-block:22px 60px}
  body[data-tab="dashboard"] header.top{display:none}
  header.top .wordmark{display:none}
  .tabbar{top:0;bottom:0;left:0;right:auto;width:236px;padding:0;display:flex;flex-direction:column;border-top:0;border-right:1px solid var(--line);background:var(--card)}
  .sb-brand{display:flex;align-items:baseline;gap:8px;padding:24px 22px 18px}
  .sb-brand .mark{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.02em}.sb-brand .mark b{color:var(--accent)}
  .sb-brand .nm{color:var(--ink-2);font-weight:500;font-size:15px}
  .tabbar .in{max-width:none;margin:0;flex:1;align-content:start;display:flex;flex-direction:column;gap:2px;padding:6px 12px}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;min-height:0;border-radius:11px;font-size:14px;font-weight:600}
  .tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
  .tab[aria-current="page"]::before{display:none}
  .tab .dot{position:static;margin-left:auto}
  .sb-user{display:block;padding:14px 16px 18px;border-top:1px solid var(--line)}
  .who2{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .av{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--ground);display:grid;place-items:center;font-weight:700}
  .who2 .n{font-weight:700;font-size:14px}.who2 .r{font-size:12px;color:var(--ink-2)}
  .sb-user .who{flex-direction:column;align-items:flex-start;gap:4px;white-space:normal}
  .sb-user .who select{width:100%}
  .fab{left:calc(50% + 118px)}
}
@media (max-width:1023px){ .tab[aria-current="page"]{color:var(--accent-text)} #pg-dashboard{max-width:760px} }

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(() => {
"use strict";

/* ---------- state ---------- */
const S = {
  db: null, assets: null, sample: null, imgCaps: null,
  products: [], brands: {}, filter: "all", q: "",
  loaded: false, dbError: "", page: 1, usage: null, lastExport: 0,
  cap: null,       // capture draft
  openId: null,    // detail product id
  drafts: [],      // unfinished captures saved to /drafts (crash recovery)
};
const MAX_WEB = 5;
const MAX_PHOTOS = 6;
const PAGE = 30;                       // rows drawn at a time — keeps a long list light on a phone
const SIZES = ["S", "M", "L", "XL", "XXL", "3XL", "4XL", "5XL", "6XL", "7XL", "8XL", "Free"];
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const blobUrl = (id) => id ? "/_blob/" + id : "";
const revoke = (url) => { if (url && url.startsWith("blob:")) URL.revokeObjectURL(url); }; // resumed drafts use /_blob/ URLs, not object URLs
const slug = (s) => String(s || "").toLowerCase().replace(/&/g, " and ").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const cleanWords = (s) => String(s || "").replace(/\bnude\b/gi, "beige");
// Same rule as scripts/build_catalogue.py slugify(article, colour) — keep them identical
function productId(p){
  const joined = [p.article, p.colour].map(x => String(x || "").trim()).filter(Boolean).join(" ");
  return joined.toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 180);
}
const CATEGORIES = [
  ["tshirts", "T-Shirts"],
  ["tops", "Tops"],
  ["shirts", "Shirts"],
  ["lowers", "Lowers"],
  ["trousers", "Trousers"],
  ["jeans", "Jeans"],
  ["nightsuits", "Night Suits"],
  ["capris", "Capris"],
  ["accessories", "Accessories"],
];
// Tags: finer details, picked by tapping from this fixed list only (never typed).
// Any category may carry any number of them; none is required.
const TAGS = [
  ["front-button", "Front button"],
  ["round-neck", "Round neck"],
  ["collar-neck", "Collar neck"],
  ["satin", "Satin"],
  ["t-lower", "T-shirt + Lower"],
  ["t-shorts", "T-shirt + Shorts"],
  ["t-capri", "T-shirt + Capri"],
  ["long-short-t", "Long / Short T-shirt + Lower"],
  ["salwar", "Salwar nightsuit"],
];
const TAG_KEYS = TAGS.map(t => t[0]);
const tagLabel = (k) => (TAGS.find(t => t[0] === k) || [, ""])[1];
// keeps only keys from the fixed list, in list order, no repeats
const cleanTags = (v) => Array.isArray(v) ? TAG_KEYS.filter(k => v.includes(k)) : [];
const tagChips = (sel, attr) => `<div class="tagchips" role="group" aria-label="Tags">${TAGS.map(([k, l]) =>
  `<button type="button" class="tchip" ${attr}="${k}" aria-pressed="${sel.includes(k)}">${l}</button>`).join("")}</div>`;
const catLabel = (k) => (CATEGORIES.find(c => c[0] === k) || [, ""])[1];
const catSelect = (id, val, key) => `<select id="${id}" ${key ? `data-k="${key}"` : ""}>
  <option value="" ${val ? "" : "selected"}>Choose…</option>
  ${CATEGORIES.map(([k, l]) => `<option value="${k}" ${val === k ? "selected" : ""}>${l}</option>`).join("")}
</select>`;
function fileNames(id){
  if (!id) return [];
  const out = [id + ".jpg"];
  for (let i = 2; i <= MAX_WEB; i++) out.push(`${id}-${i}.jpg`);
  return out;
}
let toastT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
}

/* ---------- images ---------- */
function loadImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => res({img, url});
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Could not read that photo")); };
    img.src = url;
  });
}
// Phone photos are huge (50MP on an S24), so decode them already downscaled
// where the browser supports it — a full-size decode is what runs the tab out of memory.
// Reads a JPEG's pixel size from its header (first 256 KB) without decoding the image.
async function jpegLongSide(file){
  try {
    const b = new Uint8Array(await file.slice(0, 262144).arrayBuffer());
    if (b[0] !== 0xFF || b[1] !== 0xD8) return 0;
    let i = 2;
    while (i + 9 < b.length) {
      if (b[i] !== 0xFF) { i++; continue; }
      const m = b[i + 1];
      if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) {
        const hgt = (b[i + 5] << 8) | b[i + 6], wid = (b[i + 7] << 8) | b[i + 8];
        return Math.max(hgt, wid);
      }
      i += 2 + ((b[i + 2] << 8) | b[i + 3]);
    }
  } catch (_) {}
  return 0;
}
async function shrink(file, maxSide = 1600, quality = 0.85){
  let src = null, w = 0, h = 0, url = null;
  if (typeof createImageBitmap === "function") {
    try {
      // Read the shape from a small, downscaled decode instead of opening a 12–50MP photo
      // at full size (that full decode was a big pause after every shot, and a memory spike).
      const probe = await createImageBitmap(file, {resizeWidth: 256, resizeQuality: "low"});
      const ratio = probe.height / probe.width;
      probe.close && probe.close();
      // never enlarge a photo that is already small (long side is the same whatever the rotation)
      const long = Math.min(maxSide, (await jpegLongSide(file)) || maxSide);
      if (ratio >= 1) { h = long; w = Math.max(1, Math.round(long / ratio)); }
      else { w = long; h = Math.max(1, Math.round(long * ratio)); }
      src = await createImageBitmap(file, {resizeWidth: w, resizeHeight: h, resizeQuality: "high"});
    } catch { src = null; }
  }
  if (!src) {
    const loaded = await loadImage(file);
    url = loaded.url; src = loaded.img;
    const scale = Math.min(1, maxSide / Math.max(src.naturalWidth, src.naturalHeight));
    w = Math.max(1, Math.round(src.naturalWidth * scale)); h = Math.max(1, Math.round(src.naturalHeight * scale));
  }
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  c.getContext("2d").drawImage(src, 0, 0, w, h);
  if (src.close) src.close();
  if (url) URL.revokeObjectURL(url);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", quality));
  c.width = c.height = 0;                       // let the phone reclaim the canvas straight away
  return blob;
}
async function upload(blob){
  if (!S.assets) throw {code: "not_granted"};
  try { return await S.assets.upload(blob, {type: "image/jpeg"}); }
  catch (e) {
    if (e && e.code === "store_unavailable") { await new Promise(r => setTimeout(r, 900)); return await S.assets.upload(blob, {type: "image/jpeg"}); }
    throw e;
  }
}
function uploadMsg(e){
  const c = e && e.code;
  if (c === "not_granted" || c === "capability_disabled") return "Photo storage isn't available in this view. Open the page as its owner.";
  if (c === "too_large") return "That photo is too large (20 MB max).";
  if (c === "quota_or_state") return "Photo storage is full. Remove unused photos and try again.";
  if (c === "rate_limited") return "Too many uploads at once. Wait a moment and try again.";
  return "The photo didn't upload. Check your connection and try again.";
}

/* ---------- boot ---------- */
async function boot(){
  render();
  const c = window.claude;
  if (!c || typeof c.use !== "function") { S.dbError = "Open this page inside Claude to save products."; S.loaded = true; render(); return; }
  const [db, assets, sample, downloads] = await Promise.all([c.use("db"), c.use("assets"), c.use("sample"), c.use("downloads")]);
  S.db = db; S.assets = assets; S.sample = sample; S.downloads = downloads;
  if (sample) S.imgCaps = (await sample.limits().catch(() => null))?.images || null;
  if (!db) { S.dbError = "Saving isn't available in this view."; S.loaded = true; render(); return; }
  db.doc("config/export").onSnapshot(snap => {
    S.lastExport = (snap.exists && Date.parse(snap.data().at)) || 0;
    render();
  }, () => {});
  db.doc("config/brands").onSnapshot(snap => {
    S.brands = (snap.exists && snap.data().codes) || {};
    renderCaptureIfOpen();
  }, () => {});
  if (assets) refreshUsage();
  // unfinished captures — photos already uploaded but never turned into a saved product,
  // because the tab was killed (e.g. by the phone camera app) before Save was tapped
  db.collection("drafts").orderBy("updatedAt", "desc").limit(10).onSnapshot(snap => {
    const all = snap.docs.map(d => ({...d.data(), id: d.id}));
    const isEmpty = d => !(d.photoAssetIds || []).length && !(d.tagAssetIds || []).length && !(d.colours || []).length;
    // An empty draft older than an hour belongs to a tab that was closed or killed before
    // any photo was taken. Remove it so they never pile up in the database.
    const stale = Date.now() - 3600 * 1000;
    for (const d of all) if (isEmpty(d) && Date.parse(d.updatedAt || d.createdAt || 0) < stale && (!S.cap || S.cap.draftId !== d.id)) db.collection("drafts").doc(d.id).delete().catch(() => {});
    S.drafts = all.filter(d => !isEmpty(d));
    render();
  }, () => {});
  db.collection("products").orderBy("updatedAt", "desc").limit(1000).onSnapshot(snap => {
    S.products = snap.docs.map(d => ({...d.data(), id: d.id}));
    S.loaded = true; render();
    try { window.dispatchEvent(new CustomEvent("o4u:products", {detail: S.products})); } catch (_) {}
    if (!repairDone) setTimeout(() => repairReadingCopies(), 4000);
    if (S.openId) renderDetail();
  }, e => { S.dbError = "Products couldn't load (" + e.code + "). Reload the page."; S.loaded = true; render(); });
}

async function refreshUsage(){
  try { const r = await S.assets.list(); S.usage = r && r.usage ? r.usage : null; render(); } catch { /* the meter is optional */ }
}
const mb = (n) => (n / 1048576) < 10 ? (n / 1048576).toFixed(1) + " MB" : Math.round(n / 1048576) + " MB";

/* ---------- list ---------- */
const FILTERS = [
  ["all", "All", () => true],
  ["pending", "Waiting for Claude", p => p.status === "pending"],
  ["needweb", "Needs web images", p => (p.webImages || []).length < 4],
  ["flagged", "Flagged", p => (p.flags || []).length > 0],
  ["published", "Published", p => !!p.published],
  ["out", "Out of stock", p => p.inStock === false],
];
function matches(p){
  if (!S.q) return true;
  const hay = [p.id, p.article, p.brand, p.brandCode, p.colour, p.type, (p.sizes||[]).map(s => s.size + " " + s.barcode).join(" "), cleanTags(p.tags).map(tagLabel).join(" "), catLabel(p.category)].join(" ").toLowerCase();
  return S.q.toLowerCase().split(/\s+/).every(t => hay.includes(t));
}
function render(){
  const all = S.products;
  const pub = all.filter(p => p.published).length;
  const pend = all.filter(p => p.status === "pending").length;
  $("#tally").textContent = S.loaded ? `${all.length - pend} products · ${pub} published` : "Loading…";
  $("#chips").innerHTML = FILTERS.map(([k, label, fn]) =>
    `<button class="chip" type="button" data-f="${k}" aria-pressed="${S.filter === k}">${label}<span class="n">${all.filter(fn).length}</span></button>`).join("");
  const b = $("#banner");
  b.hidden = !S.dbError; b.textContent = S.dbError;
  const db_ = $("#draftbar");
  db_.hidden = !(S.drafts.length && !S.cap);
  if (!db_.hidden) {
    const d = S.drafts[0];
    const when = new Date(d.updatedAt || d.createdAt).toLocaleString("en-IN", {day: "numeric", month: "short", hour: "numeric", minute: "2-digit"});
    const n = (d.photoAssetIds || []).length + (d.tagAssetIds || []).length + (d.colours || []).length;
    db_.innerHTML = `<span>Unfinished product from ${esc(when)} — ${n} photo${n > 1 ? "s" : ""} already saved${S.drafts.length > 1 ? ` (+${S.drafts.length - 1} more)` : ""}</span><span style="display:flex;gap:8px"><button class="x" type="button" id="draftContinue">Continue</button><button class="x" type="button" id="draftDiscard">Discard</button></span>`;
  }
  const forSite = websiteProducts();
  const changed = forSite.filter(p => Date.parse(p.updatedAt || 0) > S.lastExport);
  const eb = $("#exportbar");
  eb.hidden = !(S.downloads && window.JSZip && changed.length);
  if (!eb.hidden) {
    const shots = forSite.reduce((n, p) => n + (p.webImages || []).length, 0);
    eb.innerHTML = `<span>${changed.length} product${changed.length > 1 ? "s" : ""} changed since the last export — the file carries all ${forSite.length} published${shots > 60 ? ", so do this on a laptop" : ""}</span><button class="x" type="button" id="dlAll" ${S.zipping ? "disabled" : ""}>${S.zipping ? "Preparing…" : "Download for website"}</button>`;
  }
  const meter = $("#meter");
  const pct = S.usage && S.usage.maxBytes ? Math.round(100 * S.usage.bytes / S.usage.maxBytes) : 0;
  if (pct >= 60) {
    meter.hidden = false;
    meter.className = "meter" + (pct >= 80 ? " warnmeter" : "");
    meter.textContent = `Photo storage: ${mb(S.usage.bytes)} of ${mb(S.usage.maxBytes)} used (${pct}%)` + (pct >= 80 ? " — download for website, then delete products you no longer need" : "");
  } else meter.hidden = true;
  const fn = FILTERS.find(f => f[0] === S.filter)[2];
  const rows = all.filter(fn).filter(matches);
  const shown = rows.slice(0, S.page * PAGE);
  const list = $("#list");
  if (S.suspendList) { list.innerHTML = ""; return; }
  if (!S.loaded) { list.innerHTML = `<div class="empty-state"><p>Loading products…</p></div>`; return; }
  if (!all.length) {
    list.innerHTML = `<div class="empty-state"><h2>No products yet</h2><p>Tap <strong>New product</strong>, photograph the product, then the tag. Claude reads the tag and fills in the details.</p></div>`;
    return;
  }
  if (!rows.length) { list.innerHTML = `<div class="empty-state"><p>Nothing matches this filter.</p></div>`; return; }
  list.innerHTML = shown.map(p => {
    if (p.status === "pending") return `<button class="row" type="button" data-open="${esc(p.id)}">
      ${p.refPhoto ? `<img class="thumb" src="${blobUrl(p.refPhoto)}" alt="" loading="lazy" decoding="async" width="64" height="84">` : `<div class="thumb empty">No photo</div>`}
      <div>
        <div class="pid">Saved ${esc(new Date(p.createdAt).toLocaleString("en-IN", {day: "numeric", month: "short", hour: "numeric", minute: "2-digit"}))}</div>
        <div class="name">Details not read yet</div>
        <div class="meta">${p.noTag ? `No tag · ${esc(p.nbName)} · ₹${esc(p.nbPrice)}` : `${(p.tagPhotos || []).length} tag photo${(p.tagPhotos || []).length === 1 ? "" : "s"}`} · ${1 + (p.extraRefPhotos || []).length} product photo${(p.extraRefPhotos || []).length ? "s" : ""}${p.notes ? " · " + esc(p.notes) : ""}</div>
        <div class="foot"><span class="pill warn">Waiting for Claude</span></div>
      </div>
    </button>`;
    const web = p.webImages || [];
    const cells = Array.from({length: MAX_WEB}, (_, i) => web[i] ? `<i class="on" style="background-image:url('${blobUrl(web[i])}')"></i>` : `<i></i>`).join("");
    const mrps = [...new Set((p.sizes || []).map(s => s.mrp).filter(Boolean))];

const APP_VERSION = "v44, 14 Oct 2026 (paste order, free delivery, Send QR)";

const BK_FIELDS = ["refPhoto", "extraRefPhotos", "tagPhotos", "webImages", "photoAssetIds", "tagAssetIds"];
let bkBusy = false;
function bkStatus(t){ const el = $("#bkStatus"); if (el) el.textContent = t; }
function bkRefs(collection, id, data, out){
  const add = (field, pos, v) => { if (typeof v === "string" && v) out.push({collection, id, field, pos, asset: v}); };
  for (const f of BK_FIELDS) {
    const v = data && data[f];
    if (Array.isArray(v)) v.forEach((x, i) => add(f, i, x)); else add(f, 0, v);
  }
  if (data && Array.isArray(data.colours)) data.colours.forEach((c, i) => c && add("colours.assetId", i, c.assetId));

const bkCsv = v => { const t = String(v == null ? "" : v); return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
const bkExt = t => /png/.test(t) ? "png" : /webp/.test(t) ? "webp" : /gif/.test(t) ? "gif" : "jpg";
async function bkSha(blob){

async function bkFetch(id, url){
  const src = url || blobUrl(id);
  try { const r = await fetch(src); if (r.ok) { const b = await r.blob(); if (b && b.size) return {blob: b, how: "OK"}; } } catch (_) {}
  // Fallback when the frame refuses fetch(): draw the photo and re-encode it at full size.
  // Usable, but not byte-identical to the stored file, so it is marked as such.
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image(); const t = setTimeout(() => rej(new Error("timeout")), 20000);
      i.onload = () => { clearTimeout(t); res(i); }; i.onerror = () => { clearTimeout(t); rej(new Error("load")); };
      i.src = src;
    });
    const cv = document.createElement("canvas"); cv.width = img.naturalWidth; cv.height = img.naturalHeight;
    cv.getContext("2d").drawImage(img, 0, 0);
    const b = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.95)); cv.width = cv.height = 0;
    if (b && b.size) return {blob: b, how: "OK-REENCODED"};
  } catch (_) {}
  return null;
}
async function fullBackup(){

      bkStatus(`Reading ${name}…`);

      records[name] = {}; counts[name] = snap.docs.length;
      if (snap.docs.length >= 1000) warnings.push(`${name}: 1000 documents returned, the most one read allows. The collection may hold more than this backup.`);
      for (const d of snap.docs) { const data = d.data(); records[name][d.id] = data; bkRefs(name, d.id, data, refs); }
    }

      usage ? `  storage use: ${usage.files} files, ${mb(usage.bytes)} of ${mb(usage.maxBytes)}` : "",

$("#capBody").addEventListener("change", async e => {
  const c = S.cap; if (!c) return;

    try { for (const f of files) { const b = await shrink(f); putShot(t.dataset.slot, b, await previewOf(b)); } }
    catch (err) { c.error = "That photo couldn't be opened. Try taking it again."; renderCapture(); }
    return;
  }
  if (c.step === "review" && t.id === "fSrc") { c.form.colourSource = t.value; }

});

let idT, nbT;

// Camera tiles open the in-page camera when this page is allowed to use it. Inside the
// claude.ai artifact frame the camera is usually blocked by the host page's permissions
// policy; then the tap goes straight to the phone's camera app (the only camera left),
// with no error and no second tap. Earlier photos stay safe in the draft either way.
function liveCameraAllowed(){
  if (S.liveBlocked) return false;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
  const pol = document.permissionsPolicy || document.featurePolicy;
  try { if (pol && typeof pol.allowsFeature === "function" && !pol.allowsFeature("camera")) return false; } catch (_) {}
  return true;
}

$("#capBody").addEventListener("click", async e => {

  if (t.dataset.cminus) { const [i, z] = t.dataset.cminus.split("|"); const col = c.colours[+i]; if (col) { col.stock[z] = Math.max(0, (col.stock[z] || 0) - 1); if (!col.stock[z]) delete col.stock[z]; syncDraft(); renderCapture(true); } return; }
  if (t.dataset.rmcol != null) { const [x] = c.colours.splice(+t.dataset.rmcol, 1); if (x) { x.photo.dead = true; revoke(x.photo.url); if (x.photo.assetId && S.assets) S.assets.delete(x.photo.assetId).catch(() => {}); } syncDraft(); renderCapture(); return; }
  if (t.dataset.rmphoto != null) { const [x] = c.photos.splice(+t.dataset.rmphoto, 1); if (x) { x.dead = true; revoke(x.url); if (x.assetId && S.assets) S.assets.delete(x.assetId).catch(() => {}); } syncDraft(); renderCapture(); return; }

  if (t.dataset.minus) { const z = t.dataset.minus; c.stock[z] = Math.max(0, (c.stock[z] || 0) - 1); if (!c.stock[z]) delete c.stock[z]; syncDraft(); renderCapture(true); return; }

  else if (t.id === "doPending") savePending();

// Small on-screen preview. Showing the full 1600px photos on the capture screen kept
// ~8 MB of decoded pixels in memory per photo; a dozen photos made this tab the first
// thing Android killed when the camera app opened. Previews cost ~0.5 MB each.
async function previewOf(blob){
  try { return await shrink(blob, 480, 0.72); } catch (_) { return null; }
}
function putShot(slot, blob, preview){
  const c = S.cap; if (!c) return;
  const entry = {blob, url: URL.createObjectURL(preview || blob)};
  if (slot === "photo") { if (c.photos.length < MAX_PHOTOS) c.photos.push(entry); else { revoke(entry.url); c.error = `Up to ${MAX_PHOTOS} product photos.`; renderCapture(); return; } }
  else if (slot === "tag") {
    if (c.tags[0]) { revoke(c.tags[0].url); if (c.tags[0].assetId && S.assets) S.assets.delete(c.tags[0].assetId).catch(() => {}); c.tags[0].dead = true; }
    c.tags[0] = entry;
  }
  else if (slot === "colour") { c.colours.push({photo: entry, stock: {}, name: ""}); }
  else c.tags.push(entry);
  c.error = "";
  renderCapture();
  backgroundUpload(entry);
}
// Uploads the photo the moment it's taken, well before Save is tapped. This is purely
// additive: if it fails (or never finishes) the entry still has its blob in memory, and
// saveProduct/savePending upload it then exactly as before — nothing regresses. When it
// succeeds, the asset is already safe in storage if the tab dies, and saving is faster
// because there's nothing left to upload.
async function backgroundUpload(entry){
  if (!S.assets) return;
  const cap = S.cap;
  try {
    const id = (await upload(entry.blob)).id;
    const still = S.cap === cap && cap && !entry.dead && [...cap.photos, ...cap.tags, ...cap.colours.map(x => x.photo)].includes(entry);
    if (!still) { S.assets.delete(id).catch(() => {}); return; }
    entry.assetId = id; syncDraft();
  }
  catch { /* will be uploaded normally at Save time instead */ }
}
let draftT;
function syncDraft(){
  const c = S.cap;
  if (!c || !c.draftId || !S.db) return;
  clearTimeout(draftT);
  draftT = setTimeout(() => {
    if (!S.cap || S.cap.draftId !== c.draftId) return;
    S.db.collection("drafts").doc(c.draftId).update({
      photoAssetIds: c.photos.map(p => p.assetId).filter(Boolean),
      tagAssetIds: c.tags.map(t => t.assetId).filter(Boolean),
      colours: c.colours.filter(x => x.photo.assetId).map(x => ({assetId: x.photo.assetId, stock: x.stock, name: x.name})),
      noTag: c.noTag, nbName: c.nbName, nbPrice: c.nbPrice,
      stock: c.stock, note: c.note || "",
      updatedAt: new Date().toISOString(),
    }).catch(() => {});
  }, 400);
}

/* ---------- in-page camera ----------
   The phone's camera APP sends Chrome to the background, and Android kills the
   (heavy) claude.ai tab to free memory — the photo never reaches the page. This
   camera runs inside the page, so Chrome never leaves the foreground. It stays
   open for several shots (product, then tags) and saves each one immediately. */
let liveStream = null, liveMode = "photo", liveImgCap = null, liveTorch = false, liveBusy = false;
S.liveFailed = false;
function liveCounts(){
  const c = S.cap; if (!c) return;
  $("#liveCount").textContent = liveMode === "colour" ? `Colours ${c.colours.length}` : `Product ${c.photos.length} · Tags ${c.tags.length}`;
  $("#liveModes").hidden = liveMode === "colour";
  document.querySelectorAll("#liveModes [data-mode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === liveMode)));
}
async function openLive(mode){
  liveMode = mode === "tag" || mode === "more" ? "tag" : mode === "colour" ? "colour" : "photo";
  const box = $("#live"); box.hidden = false;
  const msg = $("#liveMsg"); msg.textContent = "Starting camera…"; msg.hidden = false;
  $("#liveTorch").hidden = true; liveCounts();
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw {name: "NotSupportedError"};
    liveStream = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: {ideal: "environment"}, width: {ideal: 1920}, height: {ideal: 1080}}});
    const track = liveStream.getVideoTracks()[0];
    const caps = (track.getCapabilities && track.getCapabilities()) || {};
    if (Array.isArray(caps.focusMode) && caps.focusMode.includes("continuous")) track.applyConstraints({advanced: [{focusMode: "continuous"}]}).catch(() => {});
    $("#liveTorch").hidden = !caps.torch;
    // ImageCapture.takePhoto() gives a real full-resolution still with autofocus,
    // not a video frame — much sharper for reading small print on tags.
    liveImgCap = typeof ImageCapture === "function" ? new ImageCapture(track) : null;
    const v = $("#liveVid"); v.srcObject = liveStream; await v.play().catch(() => {});
    msg.hidden = true;
  } catch (e) {
    closeLive();
    S.liveFailed = true;
    const c = S.cap;
    if (c) {
      const code = (e && e.name) || "unknown";
      if (code === "SecurityError" || code === "NotSupportedError") S.liveBlocked = true; // camera not allowed in this frame: use the phone camera from now on
      c.error = code === "SecurityError" || code === "NotSupportedError"
        ? `This page isn't allowed to open the camera itself (${code}). Tap the camera box again — it will open your phone's camera instead.`
        : code === "NotAllowedError"
        ? `Camera permission is blocked (${code}). In Chrome: tap the icon left of the address → Permissions → Camera → Allow, then reload. Until then use Gallery.`
        : code === "NotReadableError" || code === "AbortError"
        ? `Another app is using the camera (${code}). Close it and tap the camera box again, or use Gallery.`
        : `The camera couldn't start here (${code}). Tap the camera box to try again, or use Gallery.`;

}
function closeLive(){

async function liveShoot(){

  if (liveMode === "photo" && c.photos.length >= MAX_PHOTOS) { toast(`Up to ${MAX_PHOTOS} product photos`); return; }
  liveBusy = true; $("#liveShoot").disabled = true;
  const flash = $("#liveFlash"); flash.hidden = false; setTimeout(() => { flash.hidden = true; }, 120);
  try {
    let raw = null;
    if (liveImgCap) { try { raw = await liveImgCap.takePhoto(liveTorch ? {fillLightMode: "flash"} : {}); } catch { raw = null; } }
    if (!raw) {
      const v = $("#liveVid"); if (!v.videoWidth) throw new Error("no frame");
      const cv = document.createElement("canvas"); cv.width = v.videoWidth; cv.height = v.videoHeight;
      cv.getContext("2d").drawImage(v, 0, 0);
      raw = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.92));
      cv.width = cv.height = 0;
    }
    const blob = await shrink(raw);

}

/* Each extra colour becomes its own product (one colour = one product), waiting for

async function saveColours(c, parentId, now){
  const copies = S.db.collection("readcopies");

    } catch (_) {}

/* ---------- save for Claude to read later ---------- */
// A resumed draft's entries hold an already-uploaded asset id, not a local blob —
// fetch those back so saving and reading work the same for fresh and resumed captures.
async function entryBlob(e){
  if (e.blob) return e.blob;
  return blobFromStored(e.url);
}
// Gets a stored photo back as a Blob. fetch() of /_blob/ can be refused inside the artifact
// frame even though <img> shows the same URL fine, so fall back to drawing the image.
async function blobFromStored(url){
  try { const r = await fetch(url); if (r.ok) return await r.blob(); } catch (_) {}
  const img = await new Promise((res, rej) => {
    const i = new Image(); i.decoding = "async";
    const t = setTimeout(() => rej(new Error("photo load timed out")), 15000);
    i.onload = () => { clearTimeout(t); res(i); }; i.onerror = () => { clearTimeout(t); rej(new Error("photo load failed")); };
    i.src = url;
  });
  const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
  const cv = document.createElement("canvas");
  cv.width = Math.max(1, Math.round(img.naturalWidth * scale)); cv.height = Math.max(1, Math.round(img.naturalHeight * scale));
  cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
  const b = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.88));
  cv.width = cv.height = 0;
  if (!b) throw new Error("photo encode failed");
  return b;
}
// Self-repair: any product waiting for Claude whose reading copies are missing gets them
// rebuilt from its stored photos, quietly, once per page load, while nothing else is going on.
let repairDone = false;
async function repairReadingCopies(){
  if (repairDone || !S.db) return; repairDone = true;
  const copies = S.db.collection("readcopies");
  for (const p of S.products.filter(q => q.status === "pending")) {
    if (S.cap) { repairDone = false; return; } // capture screen open: try again later
    try {
      const have = await copies.doc(`${p.id}-photo1`).get();
      const haveTag = !(p.tagPhotos || []).length || (await copies.doc(`${p.id}-tag1`).get()).exists;
      if (have.exists && haveTag) continue;
      const now = new Date().toISOString();
      if (!have.exists && p.refPhoto) {
        const u = await readingCopy(await blobFromStored(blobUrl(p.refPhoto)), 900);
        if (u) await copies.doc(`${p.id}-photo1`).set({pending: p.id, kind: "product", order: 0, image: u, createdAt: now});
      }
      const tags = p.tagPhotos || [];
      for (let i = 0; i < tags.length; i++) {
        const d = await copies.doc(`${p.id}-tag${i + 1}`).get();
        if (d.exists) continue;
        const u = await readingCopy(await blobFromStored(blobUrl(tags[i])), 1400);
        if (u) await copies.doc(`${p.id}-tag${i + 1}`).set({pending: p.id, kind: "tag", order: i + 1, image: u, createdAt: now});
      }
    } catch (_) { /* skip this one; Claude can still read the stored photo directly */ }
  }
}
function toDataUrl(blob){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
}
async function readingCopy(blob, side){
  // small JPEG kept in the database so Claude can read it from chat later (doc limit 256 KiB)
  for (const [px, q] of [[side, 0.8], [Math.round(side * 0.8), 0.7], [Math.round(side * 0.6), 0.65], [700, 0.6]]) {
    const url = await toDataUrl(await shrink(blob, px, q));
    if (url.length < 230000) return url;
  }
  return null;
}

let readCtl = null;
async function readTags(){
  const c = S.cap;
  c.busy = "Claude is reading the tag… this takes a few seconds."; c.error = ""; renderCapture();
  const known = Object.entries(S.brands).map(([k, v]) => `${k} = ${v}`).join(", ") || "none saved yet";
  const existingArticles = [...new Set(S.products.map(p => `${p.article} (${p.brand}, ${p.colour})`))].slice(0, 300).join("; ");
  const prompt = `You are cataloguing stock for Only 4 You, a women's comfort-wear shop in Ludhiana, India.
Image 1 is the main PRODUCT PHOTO (either the packet front with the brand's model photo, or the garment itself). Images 2 onward are the PRODUCT TAG(S) photographed in the shop, possibly one per size.

Read everything printed and return product details. Rules:
- article: the full style/article number exactly as printed, INCLUDING any suffix letters (e.g. "14602B", "CS250A"). If the tag and the packet show different versions (e.g. tag "14602", packet "14602B"), silently use the longer, more complete one. Never flag article-number differences, suffix letters or cut-off design numbers.
- brand: brand name as printed (e.g. "Sweet Pini").
- brandCode: short lowercase code. Known codes: ${known}. Use a known code when the brand matches. Otherwise propose an easy-to-read 3-letter code and add a flag saying it is new.
- category: exactly one key from: ${CATEGORIES.map(c => c[0] + " (" + c[1] + ")").join(", ")}.
- tags: every key that clearly applies, chosen ONLY from: ${TAGS.map(t => t[0] + " (" + t[1] + ")").join(", ")}. Any category may have tags; none is required; a product may have several (a satin button-up set has both satin and front-button). If a tag is uncertain (for example you cannot tell whether the fabric is satin), leave it OFF and add a flag such as "Tag unsure: satin?". Never guess.
- type: short product name in Title Case from the tag description (e.g. "Satin Nightsuit").
- features: short comma list of visible details printed on the packet (e.g. "Satin, Full Sleeves").
- colour: if a colour or shade is printed on the packet or tag, use it and set colourSource "packet". Otherwise name it from the photo in 1-3 plain words (e.g. "Purple Floral") and set colourSource "named". Never use the word "nude"; say "beige" instead.
- sizes: one entry per tag photo: size as printed (S, M, L, XL, XXL, 3XL, Free, etc.). "FS" on a tag means full sleeves and is NEVER a size; mrp as a number without currency, barcode text as printed, qty = pieces per pack (2 if the tag says "QTY: 2 PC", else 1). If several tags show the same size, list it once.
- Each extra tag photo is another size of the same product. If its MRP differs, that simply means the price varies by size: record each size with its own mrp and do not flag it.
- A size counted on the rack without its own tag photo takes the MRP of the nearest smaller size that has a tag; do not flag it as missing.
- Never mention or flag brand logos or labels seen on the garment itself; only use the brand printed on the packet or tag.
- flags: only for things the shop must act on, such as an unreadable MRP or size. Empty array if all clear.
Existing products in the shop, for reference: ${existingArticles || "none yet"}.

Reply with only JSON in this shape:
{"brand":"Sweet Pini","brandCode":"swp","category":"nightsuits","tags":["front-button","satin"],"article":"14602B","type":"Satin Nightsuit","features":"Satin, Full Sleeves","colour":"Purple Floral","colourSource":"named","sizes":[{"size":"M","mrp":1589,"barcode":"14602M","qty":1}],"flags":[]}`;
  const max = S.imgCaps.maxCount || 5;
  if (readCtl) readCtl.abort();
  readCtl = new AbortController();
  try {
    const images = await Promise.all([c.photos[0], ...c.tags].slice(0, max).map(entryBlob));
    const r = await S.sample.json(prompt, {images, modelTier: "default", signal: readCtl.signal});
    const form = blankForm();
    form.brand = String(r.brand || "");
    form.brandCode = slug(r.brandCode || "");
    form.category = CATEGORIES.some(x => x[0] === r.category) ? r.category : "";
    form.tags = cleanTags(r.tags);
    form.article = String(r.article || "").toUpperCase().trim();
    form.type = String(r.type || "");
    form.features = cleanWords(r.features || "");
    form.colour = cleanWords(r.colour || "");
    form.colourSource = r.colourSource === "packet" ? "packet" : "named";
    form.sizes = Array.isArray(r.sizes) && r.sizes.length ? r.sizes.map(s => ({size: String(s.size || ""), mrp: s.mrp != null ? String(s.mrp) : "", barcode: String(s.barcode || ""), qty: Number(s.qty) || 1})) : [{size:"",mrp:"",barcode:""}];
    form.flags = Array.isArray(r.flags) ? r.flags.map(x => cleanWords(String(x))).filter(Boolean) : [];
    // Shop rule: a size counted on the rack with no tag photo of its own takes the MRP of
    // the nearest smaller tagged size (nearest larger only if none is smaller).
    {
      const tagged = form.sizes.filter(z => z.mrp !== "");
      const have = new Set(form.sizes.map(z => normSize(z.size)));
      if (tagged.length) for (const z of Object.keys(c.stock || {})) {
        if (!have.has(normSize(z))) form.sizes.push({size: z, mrp: String(priceFromNearestTag(z, tagged)), barcode: "", qty: 1});
      }
    }
    if (c.tags.length + 1 > max) form.flags.push(`Only the first ${max - 1} tag photos were read.`);
    c.form = form; c.step = "review"; c.busy = "";
  } catch (e) {
    c.busy = "";
    const code = e && e.code;
    if (code === "cancelled") return;
    if (code === "not_granted" || code === "sampling_disabled" || code === "images_unavailable" || code === "capability_disabled" || code === "not_declared") { S.imgCaps = null; c.error = "Photo reading isn't available here. Fill in the details by hand."; }
    else if (code === "rate_limited") c.error = "Claude is busy or your usage limit was reached. Wait a minute, then tap Read tag again.";
    else if (code === "image_rejected") c.error = "One of the photos couldn't be read. Retake it and try again.";
    else if (code === "invalid_json" || code === "empty_completion") c.error = "The tag couldn't be read clearly. Retake the tag photo closer and in good light, or fill in by hand.";
    else if (code === "refused") c.error = "Claude couldn't process these photos. Fill in the details by hand.";
    else c.error = "Reading failed because of a connection problem. Tap Read tag to try again.";
  }
  renderCapture();
}

/* ---------- edit rack count + per-size MRP on a saved product ---------- */
const normSize = (z) => { const u = String(z || "").trim().toUpperCase(); return u === "2XL" ? "XXL" : u === "FREE" ? "FREE" : u; };
// Shop rule: a size with no tag of its own takes the MRP of the nearest SMALLER size that
// has one (7XL untagged -> 6XL's price). Only if no smaller size is tagged, the nearest larger.
const SIZE_RANK = (z) => { const i = SIZES.indexOf(normSize(z) === "XXL" ? "XXL" : String(z).trim().toUpperCase() === "FREE" ? "Free" : String(z).trim().toUpperCase()); return i < 0 ? 99 : i; };
function priceFromNearestTag(size, tagged){ // tagged: [{size, mrp}] with mrp set
  const r = SIZE_RANK(size);
  const withRank = tagged.filter(t => t.mrp !== "" && t.mrp != null).map(t => ({...t, r: SIZE_RANK(t.size)}));
  const lower = withRank.filter(t => t.r < r).sort((a, b) => b.r - a.r)[0];
  if (lower) return lower.mrp;
  const higher = withRank.filter(t => t.r > r).sort((a, b) => a.r - b.r)[0];
  return higher ? higher.mrp : "";
}
