async function saveStockEdit(p){

/* ---------- drag to reorder website images (mouse + touch) ---------- */
const D = {tile: null, from: -1, to: -1, ghost: null, timer: 0, active: false, sx: 0, sy: 0, dx: 0, dy: 0, id: null};
function dragEnd(commit){
  clearTimeout(D.timer);
  if (D.ghost) D.ghost.remove();
  document.querySelectorAll(".web.lifted,.web.target").forEach(el => el.classList.remove("lifted", "target"));
  const {from, to, active} = D;
  Object.assign(D, {tile: null, from: -1, to: -1, ghost: null, active: false, id: null});
  if (!commit || !active || to < 0 || to === from) return;
  const p = S.products.find(x => x.id === S.openId); if (!p) return;
  const web = [...(p.webImages || [])];
  const [m] = web.splice(from, 1); web.splice(to, 0, m);
  patch(p.id, {webImages: web}, to === 0 ? "Set as main image" : `Moved to position ${to + 1}`);
}
function dragStart(){
  const r = D.tile.getBoundingClientRect();
  D.active = true; D.to = D.from;
  D.dx = D.sx - r.left; D.dy = D.sy - r.top;
  const g = document.createElement("div");
  g.className = "dragghost";
  g.style.width = r.width + "px"; g.style.height = r.height + "px";
  g.style.left = r.left + "px"; g.style.top = r.top + "px";
  g.appendChild(D.tile.querySelector("img").cloneNode());
  document.body.appendChild(g);
  D.ghost = g;
  D.tile.classList.add("lifted");
  if (navigator.vibrate) try { navigator.vibrate(15); } catch {}
}
$("#detBody").addEventListener("pointerdown", e => {
  const tile = e.target.closest(".web.drag");
  if (!tile || e.target.closest("button") || e.button > 0) return;
  Object.assign(D, {tile, from: +tile.dataset.idx, sx: e.clientX, sy: e.clientY, id: e.pointerId});
  if (e.pointerType === "mouse") return;            // mouse: start after a small move
  D.timer = setTimeout(() => { if (D.tile) dragStart(); }, 280);   // touch: press and hold

<script>

const OpsCore = (() => {
"use strict";
const SIZE_ORDER = ["XS", "S", "M", "L", "XL", "XXL", "3XL", "4XL", "5XL", "6XL", "7XL", "8XL", "FREE"];
// Same rule as the product page: 2XL and XXL are one size; Free is FREE.
const normSize = (z) => { const u = String(z || "").trim().toUpperCase().replace(/\s+/g, ""); return u === "2XL" ? "XXL" : (u === "FREESIZE" || u === "FREE") ? "FREE" : u; };

  const n = typeof rupees === "string" ? Number(rupees.replace(/[^0-9.]/g, "")) : rupees;
  return isNum(n) ? Math.round(n * 100) : null;
};

  if (!isNum(p)) return "—";

/* --- sizes, stock and prices of one product --- */

function mrpFor(p, z){

  const own = priced.find(s => normSize(s.size) === n);

  const smaller = priced.filter(s => sizeRank(s.size) < r).sort((a, b) => sizeRank(b.size) - sizeRank(a.size))[0];

const STATUS = {

  confirmed:        {label: "Bill agreed",        tone: "warn", next: "Hold the stock and ask for payment."},
  awaiting_payment: {label: "Waiting for payment", tone: "acc", next: "Check the UPI app for the payment."},
  paid:             {label: "Paid",               tone: "ok",   next: "Pack the order."},
  packed:           {label: "Packed",             tone: "ok",   next: "Book a rider and send it."},
  change_due:       {label: "Change to settle",   tone: "bad",  next: "Collect or refund the difference before sending."},
  dispatched:       {label: "On the way",         tone: "acc",  next: "Mark delivered when the customer has it."},
  failed:           {label: "Delivery failed",    tone: "bad",  next: "Arrange pickup or another delivery."},
  delivered:        {label: "Delivered",          tone: "mute", next: ""},
  refund_due:       {label: "Refund to send",     tone: "bad",  next: "Send the refund by UPI (Exchanges & refunds)."},

  const key = (x) => (x.lines || []).map(l => `${l.productId}|${normSize(l.size)}|${l.qty}`).sort().join(",");
  const k = key(o), ph = phoneDigits(o.phone).slice(-10);
  const since = Date.parse(o.createdAt || 0) - 3 * 86400000;
  const hit = (orders || []).find(x => x.id !== o.id && OPEN.includes(x.status) && phoneDigits(x.phone).slice(-10) === ph && key(x) === k && Date.parse(x.createdAt || 0) >= since);

const FREE_DELIVERY_P = 200000;
const freeDelivery = (lines) => itemsTotal(lines) >= FREE_DELIVERY_P;

const deliveryFor = (lines, enteredP) => freeDelivery(lines) ? 0 : (isNum(enteredP) ? enteredP : null);

const CHECK_CHARS = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";

  const sz = (z) => { const u = String(z).trim().toUpperCase().replace(/\s+/g, ""); return u === "2XL" ? "XXL" : (u === "FREESIZE" ? "FREE" : u); };
  const s = String(base).toUpperCase() + "|" + items.map(([id, z, q]) => `${String(id).trim().toLowerCase()},${sz(z)},${Number(q)}`).join(";");

/* ---------- O4U operations pages ----------

(() => {
"use strict";
const C = OpsCore;

        if (left < -c.change) { const e = new Error(`Only ${Math.max(0, left)} of ${prodName(prods[c.productId])} in ${C.sizeLabel(c.size)} free to sell (the rest is held for orders).`); e.code = "short"; throw e; }

function setTab(t, keepScroll){
  if (!TABS.includes(t)) t = "capture";
  O.tab = t; document.body.dataset.tab = t; store.set("o4u_tab", t);
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-current", b.dataset.tab === t ? "page" : "false"));
  for (const k of TABS.slice(1)) $("#pg-" + k).hidden = k !== t;
  if (!keepScroll) window.scrollTo(0, 0);
  renderPage();
}
document.addEventListener("click", e => {
  const b = e.target.closest(".tab[data-tab]"); if (!b) return;
  if (!$("#capture").hidden || !$("#detail").hidden) return;   // a capture or product sheet covers the tabs
  closeSheet(); setTab(b.dataset.tab);
});
function renderWho(){
  const host = $("#opsWho"); if (!host) return;
  host.innerHTML = `<label for="whoSel">Working as</label><select id="whoSel">${PEOPLE.map(n => `<option ${n === O.who ? "selected" : ""}>${n}</option>`).join("")}</select>`;
}
document.addEventListener("change", e => {
  if (e.target.id === "whoSel") { O.who = e.target.value; store.set("o4u_who", O.who); toast(`Working as ${O.who}`); }
});
function renderPage(){
  if (O.tab === "inventory") renderInventory();
  else if (O.tab === "orders") Pages.orders();
  else if (O.tab === "exchanges") Pages.exchanges();
  else if (O.tab === "dashboard") Pages.dashboard();
}
const Pages = {
  orders(){ $("#pg-orders").innerHTML = `<div class="empty-ops"><h3>Orders</h3><p>Coming in the next stage.</p></div>`; },
  exchanges(){ $("#pg-exchanges").innerHTML = `<div class="empty-ops"><h3>Exchanges &amp; refunds</h3><p>Coming in a later stage.</p></div>`; },
  dashboard(){ $("#pg-dashboard").innerHTML = `<div class="empty-ops"><h3>Dashboard</h3><p>Coming in a later stage.</p></div>`; },
};

/* ---------- Inventory ---------- */
const INV_F = [
  ["all", "All", () => true],
  ["web", "On website", p => !!p.published],
  ["off", "Not on website", p => !p.published],
  ["low", "1 piece left", p => C.totalStock(p) === 1],
  ["out", "Out of stock", p => C.totalStock(p) === 0],
  ["offer", "Offer on", p => C.offerOn(p)],
];
function invMatch(p){
  const s = O.inv;
  if (s.cat && p.category !== s.cat) return false;
  if (!s.q) return true;
  const hay = [p.id, p.article, p.brand, p.colour, p.type, catLabel(p.category), ...(p.sizes || []).map(z => z.barcode || "")].join(" ").toLowerCase();
  return s.q.toLowerCase().split(/\s+/).filter(Boolean).every(t => hay.includes(t));
}
function renderInventory(){
  const pg = $("#pg-inventory");
  if (!$("#invList", pg)) {
    pg.innerHTML = `<div class="ophead">
        <h2>Inventory</h2>
        <p class="sub" id="invSum"></p>
        <div class="oprow"><input id="invQ" class="search" type="search" placeholder="Search article, brand, colour, barcode…" autocomplete="off">
          <select id="invCat" aria-label="Category"><option value="">All categories</option>${CATS.map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select></div>
        <div class="chips" id="invChips" role="toolbar" aria-label="Filter stock"></div>
      </div>
      <p class="note" id="invNote" hidden></p>
      <div class="inv" id="invList" aria-live="polite"></div>`;
    $("#invQ", pg).value = O.inv.q; $("#invCat", pg).value = O.inv.cat;
  }
  const all = ready();
  const pend = O.products.length - all.length;
  const pieces = all.reduce((n, p) => n + C.totalStock(p), 0);
  const value = all.reduce((n, p) => n + C.sizeKeys(p).reduce((m, z) => m + (C.mrpFor(p, z) || 0) * C.stockOf(p, z), 0), 0);
  $("#invSum").textContent = `${all.length} products · ${pieces} pieces on the rack · ${C.rupees(value)} at MRP`;
  $("#invChips").innerHTML = INV_F.map(([k, l, fn]) => `<button class="chip" type="button" data-if="${k}" aria-pressed="${O.inv.f === k}">${l}<span class="n">${all.filter(fn).length}</span></button>`).join("");
  const note = $("#invNote");
  note.hidden = !pend;
  note.textContent = pend ? `${pend} product${pend > 1 ? "s" : ""} waiting for Claude to read the tag ${pend > 1 ? "are" : "is"} not listed here yet.` : "";
  const fn = INV_F.find(f => f[0] === O.inv.f)[2];
  const rows = all.filter(fn).filter(invMatch).sort((a, b) => String(a.type || "").localeCompare(String(b.type || "")) || String(a.id).localeCompare(String(b.id)));
  const shown = rows.slice(0, O.inv.page * PAGE);
  const list = $("#invList");
  if (!O.products.length) { list.innerHTML = `<div class="empty-ops"><h3>No products yet</h3><p>Products appear here after they are captured and Claude has read their tags.</p></div>`; return; }
  if (!rows.length) { list.innerHTML = `<div class="empty-ops"><p>Nothing matches.</p></div>`; return; }
  list.innerHTML = shown.map(p => {
    const th = (p.webImages || [])[0] || p.refPhoto;
    const sz = C.sizeKeys(p).map(z => {
      const n = C.stockOf(p, z), h = C.held(O.orders, p.id, z);
      return `<span class="sz1 ${n ? "" : "zero"} ${h ? "held" : ""}">${esc(C.sizeLabel(z))} <b>${n}</b>${h ? ` · ${h} held` : ""}</span>`;
    }).join("");
    const m = C.minMrp(p), off = C.offerOn(p);
    const mrps = [...new Set(C.sizeKeys(p).map(z => C.mrpFor(p, z)).filter(C.isNum))];
    const price = off ? `${C.rupees(C.toPaise(p.offerPrice))}<s>${C.rupees(m)}</s>` : (mrps.length > 1 ? `from ${C.rupees(m)}` : C.rupees(m));
    return `<button class="irow" type="button" data-inv="${esc(p.id)}">
      ${th ? `<img class="thumb" src="${blobUrl(th)}" alt="" loading="lazy" decoding="async" width="52" height="68">` : `<div class="thumb empty">No photo</div>`}
      <div style="min-width:0"><div class="name">${esc(prodName(p))}</div>
        <div class="meta">${esc(p.brand || "—")} · ${esc(p.article || "")} · ${esc(catLabel(p.category))}</div>
        <div class="szline">${sz || `<span class="sz1 zero">No stock recorded</span>`}</div></div>
      <div class="iprice">${price}${p.published ? `<span class="pill acc">Website</span>` : ""}${off ? `<span class="pill ok">Offer</span>` : ""}</div>
    </button>`;
  }).join("") + (rows.length > shown.length ? `<button class="btn ghost" type="button" id="invMore" style="margin-top:14px">Show ${Math.min(PAGE, rows.length - shown.length)} more of ${rows.length}</button>` : "");
}
document.addEventListener("input", e => {
  if (e.target.id === "invQ") { O.inv.q = e.target.value.trim(); O.inv.page = 1; renderInventory(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "invCat") { O.inv.cat = e.target.value; O.inv.page = 1; renderInventory(); }
});
document.addEventListener("click", e => {
  const c = e.target.closest("[data-if]"); if (c) { O.inv.f = c.dataset.if; O.inv.page = 1; renderInventory(); return; }
  if (e.target.closest("#invMore")) { O.inv.page++; renderInventory(); return; }
  const r = e.target.closest("[data-inv]"); if (r) openSheet({kind: "product", id: r.dataset.inv});
});

/* ---------- the details sheet (shared by every page) ---------- */
function openSheet(sh){ O.sheet = sh; $("#opsSheet").hidden = false; document.body.style.overflow = "hidden"; renderSheet(); $("#opsBody").scrollTop = 0; $("#opsSheet").scrollTop = 0; }
function closeSheet(){ O.sheet = null; $("#opsSheet").hidden = true; if ($("#capture").hidden && $("#detail").hidden) document.body.style.overflow = ""; }
$("#opsClose").addEventListener("click", () => {
  if (O.sheet && O.sheet.mode && O.sheet.id) { O.sheet.mode = null; O.sheet.f = null; renderSheet(); return; }   // Back from a form to what it belongs to
  if (O.sheet && O.sheet.back) { const b = O.sheet.back; openSheet(b); return; }
  closeSheet();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && O.sheet) closeSheet(); });
let sheetDirty = false;
function renderSheet(){
  if (!O.sheet) return;
  const a = document.activeElement;
  if (a && $("#opsSheet").contains(a) && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.type !== "checkbox") { sheetDirty = true; return; }   // never redraw under someone's typing
  sheetDirty = false;
  const sh = O.sheet;
  if (sh.kind === "product") productSheet(sh);
  else if (Pages.sheet) Pages.sheet(sh);
  $("#opsClose").textContent = (sh.mode && sh.id) || sh.back ? "Back" : "Close";
}
document.addEventListener("focusout", () => { if (sheetDirty) setTimeout(() => { if (sheetDirty) renderSheet(); }, 0); });

function productSheet(sh){
  const p = byId(sh.id);
  if (!p) { $("#opsTitle").textContent = "Product"; $("#opsBody").innerHTML = `<p class="note">This product was deleted.</p>`; return; }
  $("#opsTitle").textContent = prodName(p);
  if (sh.mode === "sale") return saleForm(p, sh);
  if (sh.mode === "stock") return stockForm(p, sh);
  if (sh.mode === "price") return priceForm(p, sh);
  const keys = C.sizeKeys(p);
  const th = (p.webImages || [])[0] || p.refPhoto;
  const miss = C.websiteMissing(p);
  const moves = O.moves.filter(m => m.productId === p.id).slice(0, 15);
  const rows = keys.map(z => { const n = C.stockOf(p, z), h = C.held(O.orders, p.id, z), mp = C.mrpFor(p, z);
    return `<tr><td><b>${esc(C.sizeLabel(z))}</b></td><td class="n">${n}</td><td class="n">${h || "–"}</td><td class="n"><b>${Math.max(0, n - h)}</b></td><td class="n">${C.offerOn(p) ? `${C.rupees(C.toPaise(p.offerPrice))} <s style="color:var(--ink-3)">${C.rupees(mp)}</s>` : C.rupees(mp)}</td></tr>`; }).join("");
  $("#opsBody").innerHTML = `
    <div class="colhead">${th ? `<img src="${blobUrl(th)}" alt="">` : ""}
      <div style="min-width:0"><div class="mono" style="font-size:12px;color:var(--ink-2);word-break:break-all">${esc(p.id)}</div>
        <div style="font-weight:600">${esc(p.brand || "")} · ${esc(p.article || "")}</div>
        <div class="hint" style="margin:2px 0 0">${esc(catLabel(p.category))}${p.features ? " · " + esc(p.features) : ""}</div></div></div>
    <div class="sect"><p class="label">Stock</p>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>Size</th><th class="n">On rack</th><th class="n">Held</th><th class="n">Free to sell</th><th class="n">Price</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="5">No sizes recorded.</td></tr>`}</tbody></table></div>
      <p class="hint" style="margin:0">“Held” pieces are reserved for orders waiting for payment or delivery.</p>
      <div class="btnrow"><button class="btn accent" type="button" data-pm="sale" ${C.totalStock(p) ? "" : "disabled"}>Sold in shop</button>
        <button class="btn ghost" type="button" data-pm="stock">Add or correct stock</button></div></div>
    <div class="sect"><p class="label">Price</p>
      <div class="swrow"><div><b>${C.offerOn(p) ? `Offer ${C.rupees(C.toPaise(p.offerPrice))} on all sizes` : "No offer"}</b><p>${C.offerOn(p) ? "Every customer gets this price on new orders." : "Customers pay the MRP of their size."}</p></div>
        <button class="x" type="button" data-pm="price">Change</button></div></div>
    <div class="sect"><p class="label">Website</p>
      <div class="swrow"><div><b>${p.published ? "Shown on the website" : "Not on the website"}</b><p>${miss.length && !p.published ? "Can't go on yet: " + esc(miss.join(", ")) + "." : "Changes reach the website after “Download for website” in Capture."}</p></div>
        <span class="switch"><input type="checkbox" id="opsPub" ${p.published ? "checked" : ""} aria-label="Show on website"><span></span></span></div>
      <button class="btn ghost" type="button" id="opsOpenProduct">Photos, details and website images</button></div>
    <div class="sect"><p class="label">Stock history</p>
      ${moves.length ? `<div class="hist">${moves.map(histLine).join("")}</div>` : `<p class="hint" style="margin:0">Nothing recorded yet. Sales, new stock and corrections will appear here.</p>`}</div>`;
}
const KIND = {sale: "Sold in shop", restock: "New stock added", recount: "Recounted", damage: "Damaged or lost", dispatch: "Sent to customer", return: "Return put back on the rack",
  replace: "Given as exchange", capture: "Added at capture", edit: "Changed on the product page", undo: "Correction"};
function histLine(m){
  return `<div class="ev"><div><b>${esc(KIND[m.kind] || m.kind)}</b> · ${esc(C.sizeLabel(m.size))}${m.unitP ? ` · ${C.rupees(m.unitP)} each` : ""}
      <div class="w">${esc(fmtWhen(m.at))} · ${esc(m.by || "")}${m.orderId ? ` · order ${esc(shortId(m.orderId))}` : ""}${m.note ? ` · ${esc(m.note)}` : ""}</div></div>
    <div class="d ${m.change < 0 ? "minus" : "plus"}">${m.change > 0 ? "+" : ""}${m.change}<div class="w" style="font-weight:400">${m.before} → ${m.after}</div></div></div>`;
}
const shortId = (id) => String(id || "").replace(/^o-/, "").toUpperCase();

/* sold in shop */
function saleForm(p, sh){
  const f = sh.f || (sh.f = {size: "", qty: 1, price: ""});
  const keys = C.sizeKeys(p);
  if (!f.size) { const first = keys.find(z => C.freeToSell(p, O.orders, z) > 0); if (first) { f.size = first; f.price = String((C.priceFor(p, first) || 0) / 100 || ""); } }
  const free = f.size ? C.freeToSell(p, O.orders, f.size) : 0;
  if (f.qty > free) f.qty = Math.max(1, free);
  $("#opsBody").innerHTML = `
    <div class="sect"><p class="label">Which size was sold?</p>
      <div class="pickgrid">${keys.map(z => { const fr = C.freeToSell(p, O.orders, z); return `<button type="button" class="pickbtn" data-ss="${esc(z)}" aria-pressed="${f.size === z}" ${fr > 0 ? "" : "disabled"}>${esc(C.sizeLabel(z))}<small>${fr} free</small></button>`; }).join("")}</div></div>
    <div class="sect"><p class="label">How many pieces?</p>
      <div class="stepper"><button type="button" data-sq="-1" aria-label="One less">−</button><output>${f.qty}</output><button type="button" data-sq="1" aria-label="One more">+</button></div></div>
    <div class="field"><label for="salePrice">Price per piece ₹</label><input id="salePrice" inputmode="decimal" value="${esc(f.price)}"><span class="hint" style="margin:0">Filled in from the ${C.offerOn(p) ? "offer" : "MRP"}. Change it only if the customer paid something else.</span></div>
    <button class="btn accent big" type="button" id="saleGo" ${f.size && free > 0 && !O.busy ? "" : "disabled"}>${f.size ? `Record sale: ${f.qty} × ${esc(C.sizeLabel(f.size))}` : "Choose a size"}</button>`;
}
/* add or correct stock */
const STOCK_WHY = [["restock", "New stock arrived", "Pieces added to what is already on the rack."], ["recount", "Recount", "Set the exact number now on the rack."], ["damage", "Damaged or lost", "Pieces taken off the rack."]];
function stockForm(p, sh){
  const f = sh.f || (sh.f = {why: "restock", n: {}});
  const keys = [...new Set([...C.sizeKeys(p), ...C.SIZE_ORDER.filter(z => z !== "XS")])].sort((a, b) => C.sizeRank(a) - C.sizeRank(b));
  const shownKeys = f.why === "restock" ? keys : C.sizeKeys(p);
  const val = (z) => f.n[z] ?? (f.why === "recount" ? C.stockOf(p, z) : 0);
  const changes = shownKeys.map(z => ({z, d: f.why === "recount" ? val(z) - C.stockOf(p, z) : f.why === "damage" ? -val(z) : val(z)})).filter(x => x.d);
  const tooFew = f.why !== "restock" ? shownKeys.filter(z => C.stockOf(p, z) + (changes.find(c => c.z === z)?.d || 0) < C.held(O.orders, p.id, z)) : [];
  const unpriced = f.why === "restock" ? changes.filter(c => !C.isNum(C.mrpFor(p, c.z))).map(c => c.z) : [];
  $("#opsBody").innerHTML = `
    <div class="sect"><p class="label">What happened?</p>
      <div class="pickgrid" style="grid-template-columns:repeat(3,minmax(0,1fr))">${STOCK_WHY.map(([k, l]) => `<button type="button" class="pickbtn" data-sw="${k}" aria-pressed="${f.why === k}" style="font-size:14px">${l}</button>`).join("")}</div>
      <p class="hint" style="margin:0">${STOCK_WHY.find(w => w[0] === f.why)[2]}</p></div>
    <div class="sect"><p class="label">${f.why === "recount" ? "Pieces on the rack now" : f.why === "damage" ? "Pieces taken off" : "Pieces added"}</p>
      ${shownKeys.length ? `<div class="stepgrid">${shownKeys.map(z => `<div class="steprow"><b>${esc(C.sizeLabel(z))}</b><div class="stepper">
        <button type="button" data-sn="${esc(z)}" data-d="-1" aria-label="One less ${esc(z)}">−</button><output>${val(z)}</output>
        <button type="button" data-sn="${esc(z)}" data-d="1" aria-label="One more ${esc(z)}">+</button></div></div>`).join("")}</div>` : `<p class="note">No sizes recorded yet. Use “New stock arrived”.</p>`}</div>
    ${tooFew.length ? `<p class="note bad">${esc(tooFew.map(C.sizeLabel).join(", "))}: fewer pieces than are held for orders. Cancel or change those orders first.</p>` : ""}
    ${unpriced.length ? `<p class="note warn">${esc(unpriced.map(C.sizeLabel).join(", "))} has no MRP yet. Add it under Price before selling.</p>` : ""}
    <div class="field"><label for="stockNote">Note (optional)</label><input id="stockNote" value="${esc(f.note || "")}" placeholder="e.g. from supplier, torn seam"></div>
    <button class="btn accent big" type="button" id="stockGo" ${changes.length && !tooFew.length && !O.busy ? "" : "disabled"}>${changes.length ? `Save ${changes.map(c => `${c.d > 0 ? "+" : ""}${c.d} ${C.sizeLabel(c.z)}`).join(", ")}` : "Nothing changed yet"}</button>`;
}
/* MRP and offer */
function priceForm(p, sh){
  const keys = C.sizeKeys(p);
  const f = sh.f || (sh.f = {mrp: Object.fromEntries(keys.map(z => [z, C.mrpFor(p, z) ? String(C.mrpFor(p, z) / 100) : ""])), on: C.offerOn(p), offer: String(C.offerOn(p) ? p.offerPrice : (p.offerSaved || ""))});
  const trial = {...p, sizes: keys.map(z => ({size: z, mrp: Number(f.mrp[z]) || null}))};
  const prob = f.on ? C.offerProblem(trial, f.offer) : "";
  const badMrp = keys.filter(z => !(Number(f.mrp[z]) > 0));
  $("#opsBody").innerHTML = `
    <div class="sect"><p class="label">MRP per size</p>
      <div class="stepgrid">${keys.map(z => `<div class="field"><label for="mrp-${esc(z)}">${esc(C.sizeLabel(z))} ₹</label><input id="mrp-${esc(z)}" data-mrp="${esc(z)}" inputmode="decimal" value="${esc(f.mrp[z])}"></div>`).join("")}</div>
      <p class="hint" style="margin:0">Use the price printed on that size's tag.</p></div>
    <div class="sect"><p class="label">Offer</p>
      <div class="swrow"><div><b>Offer for every customer</b><p>One price for all sizes. Orders already confirmed keep their price.</p></div>
        <span class="switch"><input type="checkbox" id="offOn" ${f.on ? "checked" : ""} aria-label="Offer on"><span></span></span></div>
      ${f.on ? `<div class="field"><label for="offVal">Offer price ₹</label><input id="offVal" inputmode="decimal" value="${esc(f.offer)}"></div>` : ""}
      ${prob ? `<p class="note warn">${esc(prob)}</p>` : ""}</div>
    ${badMrp.length ? `<p class="note warn">Type an MRP for ${esc(badMrp.map(C.sizeLabel).join(", "))}.</p>` : ""}
    <p class="hint" style="margin:0">The website shows the new price after the next “Download for website”.</p>
    <button class="btn accent big" type="button" id="priceGo" ${!prob && !badMrp.length && !O.busy ? "" : "disabled"}>Save price</button>`;
}
$("#opsBody").addEventListener("input", e => {
  const t = e.target, sh = O.sheet; if (!sh || !sh.f) return;
  if (t.id === "salePrice") sh.f.price = t.value;
  else if (t.id === "stockNote") sh.f.note = t.value;
  else if (t.dataset.mrp) sh.f.mrp[t.dataset.mrp] = t.value;
  else if (t.id === "offVal") sh.f.offer = t.value;
  else return;
  // live feedback without redrawing the box being typed in
  if (sh.mode === "price") { const g = $("#priceGo"); const p = byId(sh.id); if (g && p) {
    const keys = C.sizeKeys(p); const trial = {...p, sizes: keys.map(z => ({size: z, mrp: Number(sh.f.mrp[z]) || null}))};
    g.disabled = (sh.f.on && !!C.offerProblem(trial, sh.f.offer)) || keys.some(z => !(Number(sh.f.mrp[z]) > 0)); } }
});
$("#opsBody").addEventListener("change", async e => {
  const t = e.target, sh = O.sheet; if (!sh) return;
  if (t.id === "offOn") { sh.f.on = t.checked; renderSheet(); return; }
  if (t.id === "opsPub") {
    const p = byId(sh.id); if (!p) return;
    if (t.checked) { const miss = C.websiteMissing(p); if (miss.length) { t.checked = false; toast("Can't go on the website yet: " + miss.join(", ") + "."); return; } }
    try { await O.db.collection("products").doc(p.id).update({published: t.checked, updatedAt: nowIso()}); toast(t.checked ? "On the website after the next download" : "Off the website after the next download"); }
    catch (err) { t.checked = !t.checked; toast(errMsg(err)); }
  }
});
$("#opsBody").addEventListener("click", async e => {
  const sh = O.sheet; if (!sh) return;
  const t = e.target.closest("button"); if (!t) return;
  const p = sh.kind === "product" ? byId(sh.id) : null;
  if (t.dataset.pm) { sh.mode = t.dataset.pm; sh.f = null; renderSheet(); $("#opsSheet").scrollTop = 0; return; }
  if (t.id === "opsOpenProduct" && p) { closeSheet(); setTab("capture"); if (window.O4U_openDetail) window.O4U_openDetail(p.id); return; }
  if (!p) return;
  if (t.dataset.ss) { sh.f.size = t.dataset.ss; sh.f.qty = 1; sh.f.price = String((C.priceFor(p, t.dataset.ss) || 0) / 100 || ""); renderSheet(); return; }
  if (t.dataset.sq) { const free = C.freeToSell(p, O.orders, sh.f.size); sh.f.qty = Math.min(Math.max(1, sh.f.qty + Number(t.dataset.sq)), Math.max(1, free)); renderSheet(); return; }
  if (t.dataset.sw) { sh.f = {why: t.dataset.sw, n: {}, note: sh.f.note}; renderSheet(); return; }
  if (t.dataset.sn) { const z = t.dataset.sn, d = Number(t.dataset.d);
    const cur = sh.f.n[z] ?? (sh.f.why === "recount" ? C.stockOf(p, z) : 0);
    const max = sh.f.why === "damage" ? C.stockOf(p, z) : 999;
    sh.f.n[z] = Math.min(max, Math.max(0, cur + d)); renderSheet(); return; }
  if (t.id === "saleGo") {
    const unitP = C.toPaise(sh.f.price);
    if (!C.isNum(unitP) || unitP <= 0) { toast("Type the price the customer paid."); return; }
    await busy(t, async () => {
      await moveStock([{productId: p.id, size: sh.f.size, change: -sh.f.qty, unitP}], {kind: "sale"}, true);
      toast(`Sale recorded: ${sh.f.qty} × ${C.sizeLabel(sh.f.size)}`); sh.mode = null; sh.f = null;
    });
    return;
  }
  if (t.id === "stockGo") {
    const f = sh.f;
    const keys = f.why === "restock" ? Object.keys(f.n) : C.sizeKeys(p);
    const ch = keys.map(z => ({productId: p.id, size: z, change: f.why === "recount" ? (f.n[z] ?? C.stockOf(p, z)) - C.stockOf(p, z) : f.why === "damage" ? -(f.n[z] || 0) : (f.n[z] || 0)})).filter(c => c.change);
    if (!ch.length) return;
    await busy(t, async () => {
      if (f.why === "recount") {   // recount sets what the rack holds now, so it is checked against a fresh read
        await withLeases([p.id], async () => {
          const fresh = await freshProduct(p.id);
          if (JSON.stringify(fresh.stock || {}) !== JSON.stringify(p.stock || {})) throw fail("The stock changed while you were counting. Check the numbers and save again.");
        });
      }
      await moveStock(ch, {kind: f.why, note: (f.note || "").trim()}, f.why !== "restock");
      if (f.why === "restock") {   // a new size gets a size line, priced like the nearest smaller size (as on the product page)
        const fresh = await freshProduct(p.id);
        const add = ch.map(c => C.normSize(c.size)).filter(z => !(fresh.sizes || []).some(s => C.normSize(s.size) === z));
        if (add.length) await O.db.collection("products").doc(p.id).update({updatedAt: nowIso(),
          sizes: [...(fresh.sizes || []), ...add.map(z => { const m = C.mrpFor(fresh, z); const e2 = {size: z, qty: 1}; if (C.isNum(m)) e2.mrp = m / 100; return e2; })]});
      }
      toast("Stock saved"); sh.mode = null; sh.f = null;
    });
    return;
  }
  if (t.id === "priceGo") {
    const f = sh.f, keys = C.sizeKeys(p);
    await busy(t, async () => {
      const fresh = await freshProduct(p.id);
      const old = fresh.sizes || [];
      const sizes = keys.map(z => { const prev = old.find(s => C.normSize(s.size) === z) || {}; const e2 = {...prev, size: prev.size || z, mrp: Number(String(f.mrp[z]).replace(/[^0-9.]/g, ""))}; if (!e2.qty) e2.qty = 1; return e2; });
      for (const s of old) if (!sizes.some(x => C.normSize(x.size) === C.normSize(s.size))) sizes.push(s);
      const offerVal = Number(String(f.offer).replace(/[^0-9.]/g, ""));
      const data = {sizes, updatedAt: nowIso()};
      if (f.on) { data.offerPrice = offerVal; data.offerSaved = offerVal; }
      else { data.offerPrice = null; if (C.offerOn(fresh)) data.offerSaved = fresh.offerPrice; }
      await O.db.collection("products").doc(p.id).update(data);
      toast(f.on ? `Offer ${C.rupees(C.toPaise(offerVal))} saved` : "Price saved"); sh.mode = null; sh.f = null;
    });
  }
});

const delTxt = (o, none) => isFreeDel(o) ? "Free" : C.isNum(o.deliveryP) ? C.rupees(o.deliveryP) : none;
function btn(id, label, cls = "ghost", dis = false){ return `<button class="btn ${cls}" type="button" data-oa="${id}" ${dis || O.busy ? "disabled" : ""}>${label}</button>`; }

    ${messageBox(o)}

/* ---------- prepared WhatsApp messages ---------- */
function bill(o){
  return (o.lines || []).map(l => `• ${l.label} (${sizeTxt(l.size)}) × ${l.qty} — ${C.rupees(l.unitP * l.qty)}`).join("\n")
    + `\nDelivery: ${isFreeDel(o) ? "free" : C.isNum(o.deliveryP) ? C.rupees(o.deliveryP) : "we'll confirm once we check your address"}\nTotal: ${C.rupees(C.orderTotal(o))}${C.isNum(o.deliveryP) ? "" : " + delivery"}`;
}
function message(o){
  const hi = `Hi ${o.name || ""}, this is ${O.settings.shopName || "Only 4 You"}.`;
  const ref = `Order #${code(o)}`;
  const short = ["request", "confirmed"].includes(o.status) ? C.shortLines(o, O.products, O.orders) : [];
  switch (o.status) {
    case "request":
      if (short.length) return `${hi}\n${ref}: sorry, these aren't available right now:\n${short.map(s => { const l = o.lines.find(x => x.productId === s.productId && C.normSize(x.size) === s.size); return `• ${l ? l.label : s.productId} (${sizeTxt(s.size)})${s.free ? ` — only ${s.free} left` : ""}`; }).join("\n")}\n\nWould you like the available items, something else instead, or should we cancel? Nothing is charged until you confirm.`;
      return `${hi}\n${ref}: everything is available.\n\n${bill(o)}\n\nReply YES to confirm. We'll then hold the items for you and send payment details.`;
    case "confirmed": return `${hi}\n${ref} is confirmed:\n\n${bill(o)}\n\nWe'll send payment details shortly.`;
    case "awaiting_payment": return `${hi}\n${ref}: your items are held for you until ${timeTxt(o.holdUntil)}.\n\nPlease pay ${C.rupees(C.orderTotal(o))} by UPI${O.settings.upiId ? ` to ${O.settings.upiId}` : " using the QR code we're sending next"} and send us the UPI reference number. We don't take cash on delivery.\n\n${bill(o)}`;
    case "paid": case "packed": return `${hi}\n${ref}: we received ${C.rupees(o.paidP)}. Thank you!\nWe're booking your delivery now. If we can't book a rider within 24 hours of your payment, we'll refund the full amount, including delivery.`;
    case "change_due": return `${hi}\n${ref} has been changed as you asked on the phone:\n\n${bill(o)}\n\n${o.changeDiffP > 0 ? `Please pay the difference of ${C.rupees(o.changeDiffP)} by UPI${O.settings.upiId ? ` to ${O.settings.upiId}` : ""}.` : o.changeDiffP < 0 ? `We'll refund the difference of ${C.rupees(-o.changeDiffP)} by UPI.` : "The total is unchanged."}`;
    case "dispatched": return `${hi}\n${ref} is on its way!${o.tracking ? `\nTrack it here: ${o.tracking}` : ""}`;
    case "delivered": return `${hi}\n${ref} has been delivered. Thank you for shopping with us!\n\nNeed a different size? Tell us within 3 days. The item must be unworn, unwashed, with tags on. Exchanging at our Pakhowal Road shop is easiest.`;
    case "failed": return o.failure && o.failure.by === "customer"

/* ---------- paste an order from the website's WhatsApp message ---------- */
const webDocId = (base) => "w-" + String(base).toLowerCase();
// Same code pasted twice = the same order. Checks the loaded list, then the store itself.
async function existingWeb(base){
  const known = O.orders.find(x => x.webCode === base); if (known) return known;
  try { const s = await O.db.collection("orders").doc(webDocId(base)).get(); if (s.exists) return {...s.data(), id: s.id}; } catch (_) {}
  return null;
}
function pastePreview(res){
  const lines = res.items.map(it => {
    const p = byId(it.productId);
    const ok = !!p && p.status !== "pending" && C.sizeKeys(p).includes(C.normSize(it.size));
    return {...it, p, ok, unitP: ok ? C.priceFor(p, it.size) : null, label: p ? prodName(p) : it.productId, article: p ? (p.article || "") : ""};
  });
  return {lines, bad: lines.filter(l => !l.ok || !C.isNum(l.unitP) || l.unitP <= 0)};
}
function handFormFrom(res){
  const f = blankForm(), d = (res && (res.ok ? res : res.partial)) || {};
  f.name = d.name || ""; f.phone = d.phoneDigits || C.phoneDigits(d.phone || "").slice(-10); f.address = d.address || ""; f.landmark = d.landmark || "";
  if (d.base) f.webCode = d.base;
  if (C.isNum(d.websiteItemsP)) f.websiteItemsP = d.websiteItemsP;
  for (const it of d.items || []) { const p = byId(it.productId); if (p && p.status !== "pending" && C.sizeKeys(p).includes(C.normSize(it.size))) f.lines.push({productId: p.id, size: C.normSize(it.size), qty: it.qty, label: prodName(p), article: p.article || ""}); }
  return f;
}

      <tr><td colspan="3">Items</td><td class="n">${C.rupees(items)}</td></tr>

async function savePasted(sh){

  const id = webDocId(res.base), now = nowIso();
  const doc = {name: res.name.trim(), phone: res.phoneDigits, address: res.address.trim(), landmark: (res.landmark || "").trim(), notes: "", lines: ls,
    deliveryP: C.deliveryFor(ls, null), code: res.base, webCode: res.base, source: "website", status: "request", allocated: false,
    createdAt: now, updatedAt: now, by: O.who, history: [{at: now, by: O.who, what: `Pasted from the website's WhatsApp message (code ${res.base})`}]};
  if (C.isNum(res.websiteItemsP)) doc.websiteItemsP = res.websiteItemsP;
  doc.duplicateOf = C.duplicateOf({...doc, id}, O.orders);

// The totals line, redrawn on its own while typing so the rest of the form never moves under a tap.

/* ---------- writing orders safely ----------
   Each step takes a short lease on the order, re-reads it, and checks it is still at the
   stage the button was for. A second tap or a second phone can't record a payment twice. */
async function step(id, allowed, fn){
  const ref = O.db.collection("orders").doc(id);
  if (typeof ref.acquire === "function") {
    let ok = false;
    for (let i = 0; i < 14 && !ok; i++) {
      try { ok = (await ref.acquire({holder: "ord-" + id + "-" + O.who, ttlMs: 8000})).acquired; }
      catch (e) { if (e && (e.code === "capability_removed" || e.code === "invalid_argument")) { ok = true; break; } throw e; }
      if (!ok) await new Promise(r => setTimeout(r, 700));
    }
    if (!ok) throw fail("Someone else is updating this order right now. Try again in a few seconds.");
  }
  const s = await ref.get();
  if (!s.exists) throw fail("This order no longer exists.");
  const o = {...s.data(), id};
  if (!allowed.includes(o.status)) throw fail(`This order is now “${ST[o.status] ? ST[o.status].label : o.status}”. Nothing was changed.`);
  const out = await fn(o);
  const patch = out.patch;
  patch.history = [...(o.history || []), {at: nowIso(), by: O.who, what: out.what}];
  patch.updatedAt = nowIso();
  await ref.update(patch);
  return o;
}
// The stock this order needs must still be free (re-read fresh, under product leases).
async function checkFree(o, lines){
  const pids = [...new Set(lines.map(l => l.productId))];
  await withLeases(pids, async () => {
    const holding = (await freshHolding()).filter(x => x.id !== o.id);
    const prods = [];
    for (const id of pids) { try { prods.push(await freshProduct(id)); } catch { /* deleted product shows as short */ } }
    const short = C.shortLines({id: o.id, lines}, prods, holding);
    if (short.length) { const s = short[0]; const l = lines.find(x => x.productId === s.productId); throw fail(`${l ? l.label : "An item"} (${sizeTxt(s.size)}): only ${s.free} free now. Change the items first.`); }
  });
}

async function saveForm(sh){
  const f = sh.f;
  const o = sh.id ? orderById(sh.id) : null;
  const lines = formLinesWithPrices(f, o).map(l => ({productId: l.productId, size: C.normSize(l.size), qty: l.qty, unitP: l.unitP, label: l.label, article: l.article}));
  const typedP = f.delivery === "" ? null : C.toPaise(f.delivery);
  const delP = C.deliveryFor(lines, typedP);
  if (sh.mode === "change") {
    await checkFree(o, lines);
    await step(o.id, ["paid", "packed"], (fr) => {
      const tot = C.itemsTotal(lines) + delP;
      return {patch: {status: "change_due", previousLines: fr.lines, lines, deliveryP: delP, deliveryTypedP: C.isNum(typedP) ? typedP : null, changeDiffP: tot - fr.paidP}, what: `Changed on the customer's phone call: ${C.rupees(fr.paidP)} → ${C.rupees(tot)}`};
    });
    toast("Change saved. Settle the difference before sending.");
    sh.mode = null; sh.f = null; return;
  }
  const base = {name: f.name.trim(), phone: f.phone.trim(), address: f.address.trim(), landmark: f.landmark.trim(), notes: f.notes.trim(), lines, deliveryP: delP, deliveryTypedP: C.isNum(typedP) ? typedP : null};
  if (o) {
    await step(o.id, ["request", "confirmed", "awaiting_payment"], (fr) => ({
      patch: {...base, status: "request", allocated: false, holdUntil: "", choiceAt: "", duplicateOf: C.duplicateOf({...fr, ...base}, O.orders)},
      what: fr.status === "request" ? "Items or details changed" : "Items or details changed; bill and any hold reset"}));
    toast("Saved"); sh.mode = null; sh.f = null; return;
  }
  // a new request: one tap, one order, even if the button is pressed twice
  const exist = O.orders.find(x => x.submissionKey === f.key);
  if (exist) { sh.id = exist.id; sh.mode = null; sh.f = null; return; }
  if (f.webCode) { const had = await existingWeb(f.webCode); if (had) { toast(`Already saved as order #${code(had)}`); sh.id = had.id; sh.mode = null; sh.f = null; return; } }
  const id = f.webCode ? webDocId(f.webCode) : X.newId("o"), now = nowIso();
  const doc = {...base, code: f.webCode || newCode(), status: "request", allocated: false, createdAt: now, updatedAt: now, by: O.who, submissionKey: f.key,
    history: [{at: now, by: O.who, what: f.webCode ? `Website order entered by hand (code ${f.webCode})` : "Request saved"}]};
  if (f.webCode) { doc.webCode = f.webCode; doc.source = "website"; if (C.isNum(f.websiteItemsP)) doc.websiteItemsP = f.websiteItemsP; }
  doc.duplicateOf = C.duplicateOf({...doc, id}, O.orders);
  await O.db.collection("orders").doc(id).set(doc);
  toast(doc.duplicateOf ? "Saved. It looks like a repeat order — check it." : "Request saved");
  sh.id = id; sh.made = true; sh.mode = null; sh.f = null;
}

/* ---------- saving ---------- */
async function caseStep(id, allowed, fn){
  const ref = O.db.collection("cases").doc(id);
  if (typeof ref.acquire === "function") {
    let ok = false;
    for (let i = 0; i < 14 && !ok; i++) {
      try { ok = (await ref.acquire({holder: "case-" + id + "-" + O.who, ttlMs: 8000})).acquired; }
      catch (e) { if (e && (e.code === "capability_removed" || e.code === "invalid_argument")) { ok = true; break; } throw e; }
      if (!ok) await new Promise(r => setTimeout(r, 700));
    }
    if (!ok) throw fail("Someone else is updating this exchange. Try again in a few seconds.");
  }
  const s = await ref.get(); if (!s.exists) throw fail("This exchange no longer exists.");
  const c = {...s.data(), id};
  if (!allowed.includes(c.status)) throw fail(`This exchange is now “${CS[c.status] ? CS[c.status].label : c.status}”. Nothing was changed.`);
  const out = await fn(c);
  await ref.update({...out.patch, history: [...(c.history || []), {at: nowIso(), by: O.who, what: out.what}], updatedAt: nowIso()});
  return c;
}
// A refund may never take more back than the order brought in (payment plus any extra collected).
function refundRoom(orderId){
  const o = X.orderById(orderId); if (!o) return 0;
  const extra = O.cases.filter(c => c.orderId === orderId && c.replacement && c.replacement.diffP > 0).reduce((n, c) => n + c.replacement.diffP, 0);
  const used = O.refunds.filter(r => r.orderId === orderId).reduce((n, r) => n + r.amountP, 0);
  return (o.paidP || 0) + extra - used;
}
async function approveRefund(c, amountP, reason, why){
  if (amountP > refundRoom(c.orderId)) throw fail("That is more than is left to refund on this order.");
  const id = X.newId("r");
  await O.db.collection("refunds").doc(id).set({orderId: c.orderId, caseId: c.id, code: c.code, name: c.name, phone: c.phone, amountP, reason, why: why || "", status: "approved", createdAt: nowIso(), by: O.who});
  return id;
}
$("#opsBody").addEventListener("click", async e => {
  const sh = O.sheet; if (!sh || !["case", "refund"].includes(sh.kind)) return;
  const t = e.target.closest("button"); if (!t) return;
  const f = sh.f;
  if (t.dataset.openord) { X.setTab("orders", true); openSheet({kind: "order", id: t.dataset.openord}); return; }
  if (t.dataset.pickord) { f.orderId = t.dataset.pickord; renderSheet(); return; }
  if (t.dataset.cl) { f.line = +t.dataset.cl; f.qty = 1; renderSheet(); return; }
  if (t.dataset.cq) { const o = X.orderById(f.orderId); f.qty = Math.min(Math.max(1, f.qty + Number(t.dataset.cq)), piecesLeft(o, f.line)); renderSheet(); return; }
  if (t.dataset.ck2) { f.kind = t.dataset.ck2; renderSheet(); return; }
  if (t.dataset.rs) { f.sell = t.dataset.rs; renderSheet(); return; }
  if (t.dataset.rp) { f.pid = t.dataset.rp; f.size = C.normSize(t.dataset.z); renderSheet(); return; }
  if (t.dataset.ca) {
    if (t.dataset.ca === "close") { await X.busy(t, async () => { await caseStep(sh.id, ["requested"], () => ({patch: {status: "closed"}, what: "Closed: customer kept the item"})); toast("Closed"); }); return; }
    sh.mode = t.dataset.ca; sh.f = null; renderSheet(); return;
  }
  if (t.id === "cSave") {
    await X.busy(t, async () => {
      const o = X.orderById(f.orderId); const l = o.lines[f.line];
      if (f.qty > piecesLeft(o, f.line)) throw fail("Those pieces already have an exchange.");
      const id = X.newId("c"), now = nowIso();
      await O.db.collection("cases").doc(id).set({orderId: o.id, code: X.code(o), name: o.name, phone: o.phone, lineIndex: f.line, productId: l.productId, label: l.label, size: C.normSize(l.size),
        qty: f.qty, paidUnitP: l.unitP, kind: f.kind, status: "requested", deliveredAt: o.deliveredAt || "", checks: {unworn: !!f.unworn, unwashed: !!f.unwashed, tags: !!f.tags, exception: !!f.exception},
        note: (f.note || "").trim(), createdAt: now, updatedAt: now, by: O.who, history: [{at: now, by: O.who, what: "Exchange started. Stock unchanged until the item is checked."}]});
      toast("Exchange saved. Stock changes only after the item is checked.");
      sh.id = id; sh.made = true; sh.mode = null; sh.f = null;
    });
    return;
  }
  const g = t.dataset.cgo; if (!g) return;
  await X.busy(t, async () => {
    if (g === "receive") {
      await caseStep(sh.id, ["requested"], async (c) => {
        if (f.sell === "yes") await moveStock([{productId: c.productId, size: c.size, change: c.qty}], {kind: "return", caseId: c.id, orderId: c.orderId}, false);
        return {patch: {status: "received", sellable: f.sell === "yes", receivedAt: nowIso(), receivedBy: O.who}, what: f.sell === "yes" ? `Checked: sellable, +${c.qty} back on the rack` : "Checked: not sellable, kept off the rack"};
      });

    }
    if (g === "replace") {

        const pick = byId(f.pid);
        const unitP = C.priceFor(pick, f.size); const diffP = (unitP - c.paidUnitP) * c.qty;
        // moveStock re-reads the stock under the product lease and refuses pieces held for orders
        await moveStock([{productId: pick.id, size: f.size, change: -c.qty, unitP}], {kind: "replace", caseId: c.id, orderId: c.orderId}, true);
        let refundId = "";
        if (diffP < 0) refundId = await approveRefund(c, -diffP, "Cheaper replacement: difference", "");
        return {patch: {status: diffP < 0 ? "refund_due" : "completed", replacement: {productId: pick.id, label: prodName(pick), size: C.normSize(f.size), qty: c.qty, unitP, diffP, ref: (f.ref || "").trim()}, refundId},
          what: `Replacement handed over: ${c.qty} × ${prodName(pick)} ${sizeTxt(f.size)}${diffP > 0 ? `, ${C.rupees(diffP)} collected` : diffP < 0 ? `, ${C.rupees(-diffP)} refund approved` : ""}`};
      });
      toast("Replacement recorded");
    }
    if (g === "refund") {
      await caseStep(sh.id, ["received"], async (c) => {
        const amt = c.paidUnitP * c.qty;
        const refundId = await approveRefund(c, amt, "Eligible exchange, no suitable replacement", (f.why || "").trim());
        return {patch: {status: "refund_due", refundId}, what: `Refund of ${C.rupees(amt)} approved`};
      });
      toast("Refund approved. Send it, then record it under Refunds.");
    }
    if (g === "sent") {
      const ref = O.db.collection("refunds").doc(sh.id);
      const s = await ref.get(); const r = s.exists ? s.data() : null;
      if (!r || r.status !== "approved") throw fail("This refund is already recorded as sent.");

      else if (r.orderId) { try { await X.step(r.orderId, ["refund_due"], () => ({patch: {status: "refunded"}, what: `Refund of ${C.rupees(r.amountP)} sent (ref ${f.ref.trim()})`})); } catch { /* order already moved on */ } }
      toast("Refund recorded as sent");
    }
    sh.mode = null; sh.f = null;
  });
});
renderPage(); Pages.badges && Pages.badges();

/* ---------- Dashboard v2: role-aware, independent desktop and phone layouts ----------
   Numbers: the SAME pure metric functions as v1 (inserted at build time from dashboard.js, so there is one
   definition of every figure). Everything below only decides what to show, to whom, and where.
   Roles (owner / store operations) are a VIEW choice in this single-file app: the Operations view never
   renders revenue, profit, best sellers or any business total, but with no login in the Claude artifact it
   cannot be a security boundary. Real enforcement arrives with Supabase roles + database rules (roadmap V2.6). */
(() => {
"use strict";
const X = window.O4U_ops; if (!X) return;
const {O, C, esc, Pages, prodName, byId, fmtWhen, catLabel} = X;
const $ = (s, el = document) => el.querySelector(s);
const MIN = 60000, HOUR = 3600000, DAY = 86400000;
const sod = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return +d; };
const eod = (t) => sod(t) + DAY - 1;
const SOLD_KINDS = ["sale", "dispatch"];                    // pieces that left the shop for a customer
const VERIFY_KINDS = ["capture", "restock", "recount", "edit", "damage"];   // somebody looked at the rack
const PENDING = ["request", "confirmed", "awaiting_payment", "paid", "packed", "change_due"];
const LOW_AT_MOST = 2, RECOUNT_AFTER_DAYS = 60, SLOW_AFTER_DAYS = 30, EXPIRY_WARN_MS = 30 * MIN;
const ms = (v) => { const t = Date.parse(v); return Number.isFinite(t) ? t : NaN; };
const localDate = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || "")); return m ? new Date(+m[1], +m[2] - 1, +m[3]).getTime() : NaN; };

/* ---------- the period ---------- */
function rangeOf(sel, now) {
  const back = (n, label) => ({from: sod(now) - (n - 1) * DAY, to: eod(now), label});
  if (sel.range === "today") return {from: sod(now), to: eod(now), label: "Today"};
  if (sel.range === "7d") return back(7, "Last 7 days");
  if (sel.range === "custom") {

    if (Number.isFinite(f) && Number.isFinite(t) && f <= t) return {from: f, to: t + DAY - 1, label: "Custom range"};

}

/* ---------- the numbers (pure) ---------- */
function compute(D, rng, now) {
  const {from, to} = rng;
  const inR = (t) => { const x = ms(t); return x >= from && x <= to; };
  const ord = new Map(D.orders.map((o) => [o.id, o]));
  const chanOf = (m) => m.kind === "sale" ? "counter" : (ord.get(m.orderId) && ord.get(m.orderId).source === "website" ? "website" : "manual");
  const val = (m) => (m.unitP || 0) * -m.change;
  const soldIn = (a, b) => D.moves.filter((m) => SOLD_KINDS.includes(m.kind) && m.change < 0 && ms(m.at) >= a && ms(m.at) <= b);
  const zero = () => ({p: 0, n: 0});
  const sold = soldIn(from, to);
  const ch = {counter: zero(), website: zero(), manual: zero()};
  for (const m of sold) { const c = ch[chanOf(m)]; c.p += val(m); c.n += -m.change; }
  const gross = ch.counter.p + ch.website.p + ch.manual.p;
  const pieces = ch.counter.n + ch.website.n + ch.manual.n;
  const todayM = soldIn(sod(now), eod(now));
  const todayP = todayM.reduce((n, m) => n + val(m), 0);
  // the same length of time just before, for the "vs previous" line
  const span = to - from + 1;
  const prevGross = soldIn(from - span, from - 1).reduce((n, m) => n + val(m), 0);

  // chart buckets: daily up to 62 days, weekly beyond
  const days = Math.round((sod(to) - sod(from)) / DAY) + 1, step = days > 62 ? 7 : 1;
  const series = Array.from({length: Math.ceil(days / step)}, (_, i) => ({t0: sod(from) + i * step * DAY, t1: Math.min(eod(to), sod(from) + (i + 1) * step * DAY - 1), counter: 0, website: 0, manual: 0, orders: 0}));
  const slot = (t) => Math.floor((sod(t) - sod(from)) / DAY / step);
  for (const m of sold) { const s = series[slot(ms(m.at))]; if (s) s[chanOf(m)] += val(m); }
  const received = D.orders.filter((o) => inR(o.createdAt));
  for (const o of received) { const s = series[slot(ms(o.createdAt))]; if (s) s.orders++; }

  // orders
  const notCancelled = received.filter((o) => o.status !== "cancelled");
  const orders = {
    received: received.length, cancelled: received.length - notCancelled.length,
    fulfilled: received.filter((o) => ["dispatched", "delivered"].includes(o.status)).length,
    website: received.filter((o) => o.source === "website").length,
    pendingNow: D.orders.filter((o) => PENDING.includes(o.status)),
  };
  const itemsOf = (list) => list.reduce((n, o) => n + C.itemsTotal(o.lines), 0);
  const awaiting = D.orders.filter((o) => o.status === "awaiting_payment");
  const requests = D.orders.filter((o) => ["request", "confirmed"].includes(o.status));

  // needs attention: orders, refunds, holds
  const attention = [];
  const add = (pri, kind, title, sub, at, target) => attention.push({pri, kind, title, sub, at, target});
  const who = (o) => o.name || "No name";
  const code = (o) => o.code || String(o.id).slice(-6).toUpperCase();
  for (const o of D.orders) {
    const left = o.status === "awaiting_payment" && o.holdUntil ? ms(o.holdUntil) - now : null;
    if (left !== null && left <= 0) add(0, "hold", `Hold is over: #${code(o)} ${who(o)}`, "Check the UPI app before releasing the stock", o.holdUntil, {type: "order", id: o.id});
    else if (left !== null && left <= EXPIRY_WARN_MS) add(1, "hold", `Hold ends in ${Math.max(1, Math.round(left / MIN))} min: #${code(o)} ${who(o)}`, "Check the UPI app now", o.holdUntil, {type: "order", id: o.id});
    else if (o.status === "change_due") add(3, "order", `Change to settle: #${code(o)} ${who(o)}`, (C.STATUS.change_due || {}).next, o.updatedAt || o.createdAt, {type: "order", id: o.id});
    else if (o.status === "failed") add(4, "order", `Delivery failed: #${code(o)} ${who(o)}`, (C.STATUS.failed || {}).next, o.updatedAt || o.createdAt, {type: "order", id: o.id});
    else if (o.status === "paid") add(5, "order", `Paid, to pack: #${code(o)} ${who(o)}`, (C.STATUS.paid || {}).next, o.payment && o.payment.at || o.updatedAt, {type: "order", id: o.id});
    else if (o.status === "request") add(6, "order", `New request: #${code(o)} ${who(o)}`, (C.STATUS.request || {}).next, o.createdAt, {type: "order", id: o.id});
    else if (o.status === "confirmed") add(7, "order", `Bill agreed: #${code(o)} ${who(o)}`, (C.STATUS.confirmed || {}).next, o.updatedAt || o.createdAt, {type: "order", id: o.id});
    else if (o.status === "packed") add(8, "order", `Packed, needs a rider: #${code(o)} ${who(o)}`, (C.STATUS.packed || {}).next, o.updatedAt || o.createdAt, {type: "order", id: o.id});
    if (o.duplicateOf && C.OPEN.includes(o.status)) add(2, "order", `Possible repeat order: #${code(o)} ${who(o)}`, "Check with the customer", o.createdAt, {type: "order", id: o.id});
  }
  const refundsDue = D.refunds.filter((r) => r.status === "approved");
  for (const r of refundsDue) add(2, "refund", `Refund to send: ${C.rupees(r.amountP)} to ${r.name || "customer"}`, "Send by UPI, then record it under Exchanges & refunds", r.createdAt, {type: "tab", id: "exchanges"});
  attention.sort((a, b) => a.pri - b.pri || ms(a.at) - ms(b.at));

  // inventory alerts
  const ready = D.products.filter((p) => p.status !== "pending");
  const low = [], out = [];
  for (const p of ready) for (const z of C.sizeKeys(p)) {
    const n = C.stockOf(p, z), h = C.held(D.orders, p.id, z), sell = n - h;
    if (n > 0 && sell >= 1 && sell <= LOW_AT_MOST) low.push({p, z, sell, n, h});
    else if (n > 0 && sell <= 0) out.push({p, z, held: true});
    else if (n === 0 && p.published) out.push({p, z, held: false});
  }
  const lastTouch = {};
  for (const m of D.moves) if (VERIFY_KINDS.includes(m.kind)) { const t = ms(m.at); if (!(lastTouch[m.productId] >= t)) lastTouch[m.productId] = t; }
  const needsRecount = ready.filter((p) => C.totalStock(p) > 0 && !((lastTouch[p.id] || 0) >= now - RECOUNT_AFTER_DAYS * DAY));
  // stock history gaps: a change whose "before" is not the previous "after", or a rack count that is not the last "after"
  const lists = {};
  for (const m of D.moves.slice().sort((a, b) => ms(a.at) - ms(b.at))) (lists[m.productId + "|" + m.size] = lists[m.productId + "|" + m.size] || []).push(m);
  const gaps = [];
  for (const [k, list] of Object.entries(lists)) {
    for (let i = 1; i < list.length; i++) if (list[i].before !== list[i - 1].after) gaps.push({productId: list[i].productId, size: list[i].size, why: `History says ${list[i - 1].after}, next change started from ${list[i].before}`});
    const last = list[list.length - 1], p = D.products.find((x) => x.id === last.productId);
    if (p && C.stockOf(p, last.size) !== last.after) gaps.push({productId: p.id, size: last.size, why: `History ends at ${last.after}, the rack shows ${C.stockOf(p, last.size)}`});
  }

  // products
  const byProd = {}, byCat = {}, bySize = {};
  for (const m of sold) {
    const p = D.products.find((x) => x.id === m.productId);
    const b = byProd[m.productId] = byProd[m.productId] || {id: m.productId, label: m.label, n: 0, p: 0}; b.n += -m.change; b.p += val(m);
    const ck = m.category || (p && p.category) || ""; byCat[ck] = byCat[ck] || {n: 0, p: 0}; byCat[ck].n += -m.change; byCat[ck].p += val(m);
    bySize[m.size] = (bySize[m.size] || 0) + -m.change;
  }
  const lastSold = {};
  for (const m of D.moves) if (SOLD_KINDS.includes(m.kind) && m.change < 0) { const t = ms(m.at); if (!(lastSold[m.productId] >= t)) lastSold[m.productId] = t; }
  const mrpValue = (p) => C.sizeKeys(p).reduce((n, z) => n + (C.mrpFor(p, z) || 0) * C.stockOf(p, z), 0);
  const slow = ready.filter((p) => C.totalStock(p) > 0 && !((lastSold[p.id] || 0) >= now - SLOW_AFTER_DAYS * DAY))
    .map((p) => ({p, n: C.totalStock(p), v: mrpValue(p), last: lastSold[p.id] || null})).sort((a, b) => b.v - a.v);
  const firstMove = D.moves.reduce((m, x) => { const t = ms(x.at); return t < m ? t : m; }, Infinity);

  // customers (online and hand-typed orders only: walk-in buyers are not recorded)
  const phone = (o) => C.phoneDigits(o.phone).slice(-10);
  const allCount = {};
  for (const o of D.orders) if (o.status !== "cancelled" && phone(o)) allCount[phone(o)] = (allCount[phone(o)] || 0) + 1;
  const inRange = new Set(notCancelled.map(phone).filter(Boolean));
  const customers = {unique: inRange.size, repeat: [...inRange].filter((ph) => allCount[ph] > 1).length};

  // money
  const refundsDone = D.refunds.filter((r) => r.status === "completed" && inR(r.completedAt || r.createdAt));
  const refundedP = refundsDone.reduce((n, r) => n + (r.amountP || 0), 0);
  const money = {
    gross, refundedP, net: gross - refundedP,
    refundsPendingP: refundsDue.reduce((n, r) => n + (r.amountP || 0), 0), refundsPendingN: refundsDue.length,
    paymentsVerifiedP: D.orders.filter((o) => o.payment && inR(o.payment.at)).reduce((n, o) => n + (o.paidP || 0), 0),
    awaitingP: itemsOf(awaiting), awaitingN: awaiting.length, requestsP: itemsOf(requests), requestsN: requests.length,
    returnedPieces: D.moves.filter((m) => inR(m.at) && m.kind === "return").reduce((n, m) => n + m.change, 0),
  };
  const holdsOver = awaiting.filter((o) => o.holdUntil && ms(o.holdUntil) - now <= 0).length;
  const holdsSoon = awaiting.filter((o) => o.holdUntil && ms(o.holdUntil) - now > 0 && ms(o.holdUntil) - now <= EXPIRY_WARN_MS).length;
  return {range: rng, ch, gross, pieces, todayP, prevGross, series, step, orders, attention, low, out, needsRecount, gaps, money,
    top: Object.values(byProd).sort((a, b) => b.p - a.p || b.n - a.n), byCat, bySize, slow, firstMove: Number.isFinite(firstMove) ? firstMove : null,
    customers, holdsOver, holdsSoon, lowProducts: new Set(low.map((x) => x.p.id)).size, readyCount: ready.length, movesTruncated: D.moves.length >= 1000};
}

const orderTotalTxt = (o) => `${C.rupees(C.orderTotal(o))}${C.isNum(o.deliveryP) ? "" : " + delivery"}`;
function ordersHtml(s, loaded, limit = 8) {

function healthHtml(s, now, owner) {

    [s.gaps.length ? "bad" : s.firstMove ? "ok" : "mute", "Stock history", s.gaps.length ? `${s.gaps.length} place${s.gaps.length > 1 ? "s" : ""} where the rack and its history disagree` : s.firstMove ? "No gaps found" : "Nothing recorded yet"],
    [s.needsRecount.length ? "warn" : "ok", "Counts", s.needsRecount.length ? `${s.needsRecount.length} product${s.needsRecount.length > 1 ? "s" : ""} not counted in ${RECOUNT_AFTER_DAYS} days` : "Every product counted recently"],

function performanceHtml(s, now) {
  const top = s.top.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Product</th><th class="n">Pieces</th><th class="n">Sales</th></tr></thead><tbody>${s.top.slice(0, 6).map((t) => `<tr data-inv="${esc(t.id)}"><td>${esc(t.label || (byId(t.id) ? prodName(byId(t.id)) : t.id))}</td><td class="n">${t.n}</td><td class="n">${R(t.p)}</td></tr>`).join("")}</tbody></table></div>` : empty("No sales recorded for this period.");
  const catMax = Math.max(1, ...Object.values(s.byCat).map((c) => c.p));

  const sizes = Object.keys(s.bySize).length ? `<div class="chips2">${Object.entries(s.bySize).sort((a, b) => b[1] - a[1]).map(([z, n]) => `<span class="sz1">${esc(C.sizeLabel(z))} <b>${n}</b></span>`).join("")}</div>` : empty("No sales recorded for this period.");
  const slow = s.slow.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Product</th><th class="n">On rack</th><th class="n">At MRP</th></tr></thead><tbody>${s.slow.slice(0, 5).map((x) => `<tr data-inv="${esc(x.p.id)}"><td>${esc(prodName(x.p))}<div class="muted">${x.last ? `last sold ${esc(ago(new Date(x.last).toISOString(), now))}` : "no sale recorded"}</div></td><td class="n">${x.n}</td><td class="n">${R(x.v)}</td></tr>`).join("")}</tbody></table></div>${moreHint(s.slow.length, 5, "products")}` : empty(`Everything in stock sold in the last ${SLOW_AFTER_DAYS} days.`, true);
  const cust = `<div class="stats4 two"><div><b>${s.customers.unique}</b><span>customers ordered</span></div><div><b>${s.customers.repeat}</b><span>ordered before${s.customers.unique ? ` (${Math.round(100 * s.customers.repeat / s.customers.unique)}%)` : ""}</span></div></div>`;
  return `<div class="two"><div><p class="mini">Best sellers by sales</p>${top}</div><div><p class="mini">Not sold in ${SLOW_AFTER_DAYS} days, most money on the rack first</p>${slow}</div></div>
    <div class="two"><div><p class="mini">Sales by category</p>${cats}</div><div><p class="mini">Pieces sold by size</p>${sizes}<p class="mini" style="margin-top:14px">Customers (online and typed-in orders)</p>${cust}</div></div>`;
}
function financialHtml(s) {
  const m = s.money;
  return `<div class="fin"><div class="frow"><span>Sales (gross)</span><b>${R(m.gross)}</b></div><div class="frow"><span>Refunds sent</span><b>− ${R(m.refundedP)}</b></div><div class="frow tot"><span>Net sales</span><b>${R(m.net)}</b></div>
    <div class="frow soft"><span>Discounts given</span><em>Not recorded: the price before the offer isn't saved with each sale.</em></div><div class="frow soft"><span>Gross profit</span><em>Cost information required: no cost price is stored for products.</em></div></div>
    <p class="mini">Not income yet</p><div class="fin"><div class="frow"><span>Payments checked on orders</span><b>${R(m.paymentsVerifiedP)}</b></div><div class="frow"><span>Waiting for payment (${m.awaitingN})</span><b>${R(m.awaitingP)}</b></div><div class="frow"><span>Requests and agreed bills (${m.requestsN})</span><b>${R(m.requestsP)}</b></div><div class="frow"><span>Refunds approved, not sent (${m.refundsPendingN})</span><b>${R(m.refundsPendingP)}</b></div></div>`;
}
function definitionsHtml(s) {
  return `<ul class="defs"><li><b>Sales</b>: pieces that left the shop in the period, at the price charged. Counter sales count when recorded; online and WhatsApp orders count when handed to the rider. Requests and unpaid orders are never included.</li>
    <li><b>Net sales</b>: sales minus refunds actually sent in the period. Exchanges settled by a price difference are not included.</li>
    <li><b>Payments checked</b>: money staff confirmed in the UPI app on orders. Counter sales don't record how the customer paid, so cash and UPI at the counter can't be separated.</li>
    <li><b>Website</b> means the order came through the website; <b>WhatsApp / phone</b> means somebody typed it in.</li>
    <li><b>Low stock</b>: ${LOW_AT_MOST} or fewer free to sell in a size (rack count minus pieces held for orders).</li>
    <li><b>Needs a recount</b>: stock on the rack but no count, restock, capture, damage entry or correction in ${RECOUNT_AFTER_DAYS} days.</li>
    <li><b>Stock history gaps</b>: a change that does not start where the previous one ended, or a rack count different from the last change.</li>
    <li><b>Customers</b> are counted from order phone numbers only. People who buy at the counter are not recorded.</li>
    <li>Sales are counted from ${s.firstMove ? esc(dayLabel(s.firstMove)) : "the first recorded stock change"}; earlier sales were not recorded in Stockroom.${s.movesTruncated ? " This view reads the latest 1,000 stock changes." : ""}</li></ul>`;
}

/* stock sheet (same behaviour as before) */
function matrixData() {
  const prods = O.products.filter((p) => p.status !== "pending").sort((a, b) => (catLabel(a.category) || "zz").localeCompare(catLabel(b.category) || "zz") || prodName(a).localeCompare(prodName(b)));
  const sizes = [...new Set(prods.flatMap((p) => C.sizeKeys(p)))].sort((a, b) => C.sizeRank(a) - C.sizeRank(b) || a.localeCompare(b));
  return {prods, sizes};
}
function matrixHtml() {
  const {prods, sizes} = matrixData();
  if (!prods.length) return empty("No products yet.");
  const q = (O.dash.mq || "").toLowerCase().trim();
  const shown = q ? prods.filter((p) => [prodName(p), p.article, p.brand, catLabel(p.category)].join(" ").toLowerCase().includes(q)) : prods;
  const cell = (p, z) => { const n = C.stockOf(p, z), h = C.held(O.orders, p.id, z); if (!C.sizeKeys(p).includes(z)) return `<td class="z">·</td>`; return `<td class="${n ? "" : "z"}">${n}${h ? `<small>${h} held</small>` : ""}</td>`; };
  return `<div class="pagehead"><p class="label" style="margin:0">Pieces on the rack</p><button class="x" type="button" id="dlSheet">Download sheet (.csv)</button></div>
    <input id="mq" class="search" type="search" placeholder="Filter the sheet: product, article, brand…" value="${esc(O.dash.mq || "")}" autocomplete="off" style="margin-bottom:8px">
    <div class="scroll"><table class="matrix"><thead><tr><th class="nm">Product</th>${sizes.map((z) => `<th>${esc(C.sizeLabel(z) === "Free size" ? "Free" : z)}</th>`).join("")}<th>Total</th></tr></thead>
    <tbody>${shown.map((p) => `<tr data-inv="${esc(p.id)}"><td class="nm" title="${esc(prodName(p))}">${esc(prodName(p))}<small style="color:var(--ink-2)">${esc(p.article || "")}</small></td>${sizes.map((z) => cell(p, z)).join("")}<td><b>${C.totalStock(p)}</b></td></tr>`).join("") || `<tr><td class="nm" colspan="${sizes.length + 2}">Nothing matches.</td></tr>`}</tbody></table></div>
    <p class="hint">Tap a row to open it. The download has every product, with MRP, offer and website status.</p>`;
}
const csvCell = (v) => { const t = String(v == null ? "" : v); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
async function downloadSheet() {
  const dl = window.claude && typeof window.claude.use === "function" ? await window.claude.use("downloads") : null;
  if (!dl) { X.toast("Downloads aren't available in this view. Open Stockroom in the browser."); return; }
  const {prods, sizes} = matrixData();
  const head = ["Product id", "Article", "Brand", "Category", "Product", "Colour", ...sizes.map((z) => "Stock " + C.sizeLabel(z)), "Total", "Held for orders", ...sizes.map((z) => "MRP " + C.sizeLabel(z)), "Offer price", "On website"];
  const rows = prods.map((p) => {
    const heldAll = C.sizeKeys(p).reduce((n, z) => n + C.held(O.orders, p.id, z), 0);
    const mrp = (z) => { const v = C.sizeKeys(p).includes(z) ? C.mrpFor(p, z) : null; return C.isNum(v) ? v / 100 : ""; };
    return [p.id, p.article || "", p.brand || "", catLabel(p.category) || "", p.type || "", p.colour || "", ...sizes.map((z) => C.sizeKeys(p).includes(z) ? C.stockOf(p, z) : ""), C.totalStock(p), heldAll, ...sizes.map(mrp), C.isNum(p.offerPrice) && p.offerPrice > 0 ? p.offerPrice : "", p.published ? "Yes" : "No"];
  });
  const csv = "﻿" + [head, ...rows].map((r) => r.map(csvCell).join(",")).join("\r\n");
  const d = new Date(), pad = (n) => String(n).padStart(2, "0");
  try { await dl.save({filename: `o4u-stock-sheet-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.csv`, data: new Blob([csv], {type: "text/csv"})}); X.toast("Stock sheet saved"); }
  catch (e) { X.toast(e && e.code === "declined" ? "Download cancelled." : "The sheet couldn't be saved. Try again."); }
}

/* ---------- Store Operations pieces (no business totals) ---------- */
function paymentsHtml(now) {

  return `<div class="alist">${list.slice(0, 6).map((o) => { const left = o.holdUntil ? ms(o.holdUntil) - now : null; const t = left === null ? "no timer" : left <= 0 ? "hold is over" : `ends in ${Math.max(1, Math.round(left / MIN))} min`; return `<button type="button" class="arow" data-ord="${esc(o.id)}"><i class="pri p${left !== null && left <= 0 ? 0 : left !== null && left <= EXPIRY_WARN_MS ? 1 : 3}"></i><span class="at">#${esc(o.code || String(o.id).slice(-6).toUpperCase())} ${esc(o.name || "No name")} · ${orderTotalTxt(o)}</span><span class="as">Check the UPI app · ${esc(t)}</span><span class="chev">Verify ›</span></button>`; }).join("")}</div>${moreHint(list.length, 6, "orders")}`;

function exchangesHtml() {

const quickActions = () => `<div class="qa">${[["capture", "New product"], ["sale", "Sold in shop"], ["stock", "Add or fix stock"], ["paste", "Paste WhatsApp order"]].map(([k, l]) => `<button type="button" data-qa="${k}">${ic(k)}<span>${l}</span></button>`).join("")}</div>`;

    <div class="kpirow">${opsKpis(s, now)}</div>
    <div class="grid2 a">${card("Urgent actions", attentionHtml(s, 10, now, loaded), {cls: "att", extra: s.attention.length ? `<span class="badge ${s.attention.some((a) => a.pri <= 1) ? "bad" : ""}">${s.attention.length}</span>` : ""})}${card("Payments to verify", paymentsHtml(now))}</div>
    <div class="grid2 b">${card("Orders in progress", ordersHtml(s, loaded, 8), {extra: `<button type="button" class="x" data-go="orders">All orders</button>`})}<div class="stack">${card("Quick actions", quickActions())}${card("Exchanges and refunds", exchangesHtml(), {extra: `<button type="button" class="x" data-go="exchanges">Open</button>`})}</div></div>
    <div class="grid2 b">${card("Stock to check", inventoryCard(s, false))}${card("Shop health", healthHtml(s, now, false))}</div>
    ${card("Stock sheet", matrixHtml())}</div>`;
}
function opsMobile(c) {
  const {s, now, loaded} = c;
  return `<div class="dv2 ops mob">
    <header class="mtop"><div><h2>Today</h2><p class="sub">${esc(new Date(now).toLocaleDateString("en-IN", {weekday: "long", day: "numeric", month: "long"}))}</p></div>${viewAs()}</header>
    ${quickActions()}
    ${card("Urgent actions", attentionHtml(s, 5, now, loaded), {cls: "att", extra: s.attention.length ? `<span class="badge ${s.attention.some((a) => a.pri <= 1) ? "bad" : ""}">${s.attention.length}</span>` : ""})}
    ${card("Payments to verify", paymentsHtml(now))}
    ${acc("orders", "Orders in progress", ordersHtml(s, loaded, 6), String(s.orders.pendingNow.length))}${acc("ex", "Exchanges and refunds", exchangesHtml())}${acc("inv", "Stock to check", inventoryCard(s, true), s.low.length + s.out.length ? String(s.low.length + s.out.length) : "")}${acc("health", "Shop health", healthHtml(s, now, false))}${acc("sheet", "Stock sheet", matrixHtml())}</div>`;
}

Pages.dashboard = function () {
  const pg = $("#pg-dashboard");
  watchExport();
  const now = Date.now(), rng = rangeOf(O.dash, now);
  const loaded = !!(O.loaded && O.loaded.orders && O.loaded.moves);
  const s = compute({products: O.products, orders: O.orders, moves: O.moves, refunds: O.refunds}, rng, now);
  const role = viewRole(), desk = DESK.matches;
  const c = {s, now, rng, loaded};
  pg.innerHTML = (role === "owner" ? (desk ? ownerDesktop(c) : ownerMobile(c)) : (desk ? opsDesktop(c) : opsMobile(c)))
    + ((!O.products.length && !O.orders.length && !O.moves.length && loaded) ? `<p class="note">Nothing is recorded yet. Capture products, record sales and take orders, and this page fills in by itself.</p>` : "");
  window.__dashState = s; window.__dashView = {role, layout: desk ? "desktop" : "mobile"};
  bindChart(s);
};

/* ---------- shell: sidebar brand and user, role-aware labels ---------- */
function decorateShell() {
  const tb = $(".tabbar"); if (!tb || $(".sb-brand")) return;
  const brand = document.createElement("div"); brand.className = "sb-brand"; brand.innerHTML = `<span class="mark">O<b>4</b>U</span><span class="nm">Stockroom</span>`;
  const user = document.createElement("div"); user.className = "sb-user"; user.innerHTML = `<div class="who2"><span class="av" id="sbAv"></span><div><div class="n" id="sbName"></div><div class="r" id="sbRole"></div></div></div><div id="sbWhoSlot"></div>`;
  tb.insertBefore(brand, tb.firstChild); tb.appendChild(user);
}
function placeWho() {
  const who = $("#opsWho"), slot = $("#sbWhoSlot"), head = $("header.top .brandrow"); if (!who || !slot || !head) return;
  if (DESK.matches) slot.appendChild(who); else head.appendChild(who);
}
function applyRole() {
  const role = viewRole();
  const tab = $('.tab[data-tab="dashboard"]');
  if (tab) { const t = [...tab.childNodes].reverse().find((n) => n.nodeType === 3 && n.textContent.trim()); if (t) t.textContent = role === "owner" ? "Dashboard" : "Today"; }
  const av = $("#sbAv"), nm = $("#sbName"), rl = $("#sbRole");
  if (av) av.textContent = String(O.who || "?").charAt(0).toUpperCase();
  if (nm) nm.textContent = O.who; if (rl) rl.textContent = ROLE_LABEL[role] + (role !== baseRole() ? " view" : "");
  document.body.dataset.role = role;
}
decorateShell(); placeWho(); applyRole();
DESK.addEventListener("change", () => { placeWho(); if (O.tab === "dashboard") Pages.dashboard(); });
document.addEventListener("change", (e) => {
  if (e.target.id === "whoSel") { applyRole(); if (O.tab === "dashboard") Pages.dashboard(); }
  if (e.target.id === "viewAs") { store.set("o4u_view", e.target.value); applyRole(); Pages.dashboard(); }
  if (e.target.id === "dFrom" || e.target.id === "dTo") { O.dash[e.target.id === "dFrom" ? "from" : "to"] = e.target.value; Pages.dashboard(); }
});

function bindChart(s) {
  const svg = $("#dChart"), tip = $("#dTip"); if (!svg || !tip) return;
  const show = (e) => {
    const h = e.target.closest(".hit"); if (!h) { tip.hidden = true; return; }
    const b = s.series[+h.dataset.i], tot = b.counter + b.website + b.manual;
    tip.innerHTML = O.dash.metric === "orders" ? `<b>${esc(dayLabel(b.t0))}${s.step > 1 ? " week" : ""}</b><br>${b.orders} order${b.orders === 1 ? "" : "s"} received`
      : `<b>${esc(dayLabel(b.t0))}${s.step > 1 ? " week" : ""}</b><br>${CHAN.map(([k, l, c]) => `<span><i style="background:${c}"></i>${l} ${R(b[k])}</span>`).join("<br>")}<br><b>${R(tot)}</b> · ${b.orders} order${b.orders === 1 ? "" : "s"} received`;
    const box = svg.getBoundingClientRect(), r = h.getBoundingClientRect();
    tip.hidden = false;
    tip.style.left = Math.min(Math.max(8, r.left - box.left + r.width / 2 - 80), Math.max(8, box.width - 168)) + "px"; tip.style.top = "4px";
  };
  svg.addEventListener("pointermove", show); svg.addEventListener("click", show); svg.addEventListener("pointerleave", () => { tip.hidden = true; });
}
let exportSub = false;
function watchExport() {
  if (exportSub || !O.db) return; exportSub = true;
  O.db.doc("config/export").onSnapshot((snap) => { O.dash.exportAt = (snap.exists && ms(snap.data().at)) || 0; if (O.tab === "dashboard") Pages.dashboard(); }, () => {});
}

/* ---------- actions ---------- */
document.addEventListener("click", (e) => {
  if (O.tab !== "dashboard") return;
  const dr = e.target.closest("[data-dr]"); if (dr) { O.dash.range = dr.dataset.dr; if (dr.dataset.dr === "custom" && !O.dash.from) { const t = new Date(); O.dash.to = t.toISOString().slice(0, 10); O.dash.from = new Date(+t - 6 * DAY).toISOString().slice(0, 10); } Pages.dashboard(); return; }
  const mt = e.target.closest("[data-metric]"); if (mt) { O.dash.metric = mt.dataset.metric; Pages.dashboard(); return; }
  const a = e.target.closest("[data-att]"); if (a) { const it = window.__dashState.attention[+a.dataset.att]; if (!it) return; if (it.target.type === "tab") X.setTab(it.target.id, true); else { X.setTab("orders", true); X.openSheet({kind: "order", id: it.target.id}); } return; }
  const o = e.target.closest("[data-ord]"); if (o) { X.setTab("orders", true); X.openSheet({kind: "order", id: o.dataset.ord}); return; }
  const cs = e.target.closest("[data-case]"); if (cs) { X.setTab("exchanges", true); X.openSheet({kind: "case", id: cs.dataset.case}); return; }
  const pr = e.target.closest("[data-prod]"); if (pr) { X.openSheet({kind: "product", id: pr.dataset.prod}); return; }
  const rc = e.target.closest("[data-recount]"); if (rc) { X.openSheet({kind: "product", id: rc.dataset.recount, mode: "stock", f: {why: "recount", n: {}}}); return; }
  const g = e.target.closest("[data-go]"); if (g) { X.setTab(g.dataset.go); return; }
  const qa = e.target.closest("[data-qa]"); if (qa) {
    const k = qa.dataset.qa;
    if (k === "capture") X.setTab("capture");
    else if (k === "paste") { X.setTab("orders"); setTimeout(() => { const b = $("#ordPaste"); if (b) b.click(); }, 60); }
    else { X.setTab("inventory"); setTimeout(() => { const i = $("#invQ"); if (i) i.focus({preventScroll: true}); }, 60); }
    return;
  }
  if (e.target.closest("#dlSheet")) { downloadSheet(); return; }
  const row = e.target.closest("tr[data-inv]"); if (row) X.openSheet({kind: "product", id: row.dataset.inv});
});
document.addEventListener("toggle", (e) => { const d = e.target; if (d && d.dataset && d.dataset.sec) O.dash.open[d.dataset.sec] = d.open; }, true);
let mqT;
document.addEventListener("input", (e) => {
  if (e.target.id !== "mq") return;
  clearTimeout(mqT); mqT = setTimeout(() => { O.dash.mq = e.target.value; const pos = e.target.selectionStart; Pages.dashboard(); const i = document.getElementById("mq"); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (_) {} } }, 250);
});
X.renderPage();
})();

</script>



</body></html>
